мощь","q":"Что надо сделать для определения наличия дыхания при бессознательном состоянии пострадавшего?","options":["Поднести зеркальце или птичье перо к носу пострадавшего","Поднести к носу пострадавшего внутреннюю сторону своего запястья или щеку","Приложить ухо к груди пострадавшего и прослушать дыхание"],"answer":1},{"id":157,"section":"Первая помощь","q":"Каковы признаки клинической смерти?","options":["Зрачки расширены, на свет не реагируют, пульс не регистрируется на сонной артерии, дыхания нет","Зрачки сужены, на свет не реагируют, пульс не регистрируется на предплечье","Зрачки разные, на свет реагируют, пульс на предплечье не определяется, очень редкое дыхание"],"answer":0},{"id":158,"section":"Первая помощь","q":"В каком порядке проводятся мероприятия первой помощи при ранении?","options":["Остановка кровотечения, обеззараживание раны, наложение повязки","Обеззараживание раны, наложение повязки, остановка кровотечения","Остановка кровотечения, наложение повязки"],"answer":0},{"id":159,"section":"Первая помощь","q":"Какие действия проводятся при проникающем ранении грудной клетки (с выходом воздуха в плевральную полость)?","options":["Придание возвышенного положения, первоначальное закрытие раны ладонью, затем закрытие раны повязкой, не пропускающей воздух - с использованием индивидуального перевязочного пакета, иного полиэтиленового пакета и т.п.","Придание возвышенного положения, первоначальное закрытие раны ладонью, закрытие раны повязкой, обеспечивающей фиксацию грудной клетки пострадавшего","Придание пострадавшему положения «на спине» первоначальное закрытие раны ладонью, затем закрытие раны повязкой, не пропускающей воздух - с использованием индивидуального перевязочного пакета, иного полиэтиленового пакета и т.п."],"answer":0},{"id":160,"section":"Первая помощь","q":"Какие правила оказания первой помощи соблюдаются при проникающем ранении в брюшную полость?","options":["Не давать пострадавшему пить жидкость, извлечь инородное тело, накрыть рану стерильной салфеткой","Приподнять голову, дать сладкое теплое питье, накрыть стерильной салфеткой и положить холод на рану","Не давать пострадавшему пить жидкость, не извлекать инородное тело, накрыть рану стерильной влажной салфеткой"],"answer":2},{"id":161,"section":"Первая помощь","q":"Что надо делать при нахождении ножа или другого ранящего предмета в ране?","options":["Вытащить нож и быстро, без обработки раны антисептиком, наложить повязку","Применить пальцевое прижатие, наложить жгут выше места ранения, вытащить ранящий предмет, наложить повязку","Оставить ранящий предмет в ране, зафиксировать предмет в ране, наложив вокруг него повязку"],"answer":2},{"id":162,"section":"Первая помощь","q":"Что надо сделать при возникновении непроходящих в покое острых болей за грудиной (в области сердца)?","options":["Немедленно вызвать «Скорую помощь», обеспечить пострадавшему полный покой в полусидячем положении, обеспечить приток воздуха","Положить пострадавшего на спину, укутать одеялом, вызвать «Скорую помощь»","Посадить пострадавшего, обеспечить приток свежего воздуха, положить на грудь холод, вызвать «Скорую помощь»"],"answer":0},{"id":163,"section":"Первая помощь","q":"Что в первую очередь может помочь при возникновении не проходящих в покое острых болей за грудиной (в области сердца)?","options":["Измерение давления и частоты пульса","Обеспечение физической нагрузки","Прием нитроглицерина под язык (только если пострадавший знает о своей болезни и имеет его при себе)"],"answer":2},{"id":164,"section":"Первая помощь","q":"Что необходимо приложить к ушибленному месту?","options":["Грелку","Холод","Спиртовой компресс"],"answer":1},{"id":165,"section":"Первая помощь","q":"Что необходимо сделать при ожоговой ране?","options":["Очистить рану и промыть ее холодной водой.","Наложить увлажненную стерильную повязку.","Смазать рану маслом, наложить повязку."],"answer":1},{"id":166,"section":"Первая помощь","q":"При попадании слезоточивых и раздражающих веществ на кожу следует:","options":["Протереть последовательно тремя тампонами - с 40% раствором этилового спирта, с 3% раствором бикарбоната натрия (соды), с мыльным раствором","Промыть кожу холодной водой","Промокнуть сухой ветошью"],"answer":0},{"id":167,"section":"Первая помощь","q":"При попадании слезоточивых и раздражающих веществ в глаза необходимо:","options":["Протереть глаза масляным тампоном","Протереть глаза сухой ветошью","Промыть глаза обильной струей теплой воды, затем 2% раствором бикарбоната натрия (соды)"],"answer":2},{"id":168,"section":"Первая помощь","q":"Что необходимо сделать при ранении одного глаза?","options":["Обработать глаз альбуцидом, наложить на глаз стерильную повязку.","Промыть глаз водой, наложить на глаз стерильную повязку.","Наложить стерильную повязку на оба глаза."],"answer":2},{"id":169,"section":"Первая помощь","q":"При повреждении костей предплечья или голени шину накладывают:","options":["С захватом только верхнего (по отношению к месту перелома) сустава","С захватом двух суставов (выше и ниже места перелома)","С захватом трех суставов"],"answer":1},{"id":170,"section":"Первая помощь","q":"При повреждении костей плеча или бедра шину накладывают:","options":["С захватом только верхнего (по отношению к месту перелома) сустава","С захватом только двух суставов (выше и ниже места перелома)","С захватом трех суставов (двух ниже и одного выше места перелома)"],"answer":2},{"id":171,"section":"Первая помощь","q":"Каков порядок оказания первой помощи при открытых переломах?","options":["Обезболить (по возможности), наложить повязку, наложить шину","Наложить шину, наложить повязку на рану","Наложить шину и обезболить (по возможности)"],"answer":0},{"id":172,"section":"Первая помощь","q":"При каких действиях достигается наибольшая эффективность оказания помощи при выведении пострадавшего из обморока?","options":["При укутывании пострадавшего в одеяло, приведения его в боковое устойчивое положение","При поднятии ног пострадавшего выше уровня тела, при скручивающем нажатии на середину грудины, при наличии нашатырного спирта - при поднесении к носу и смазывании висков ваткой, смоченной нашатырным спиртом","При нажатии на точку в центре носогубного треугольника"],"answer":1},{"id":173,"section":"Первая помощь","q":"Каковы действия по оказанию первой помощи при обморожении?","options":["Растереть обмороженную конечность с помощью спиртосодержащих растворов","Растереть обмороженную конечность снегом","Укутать пострадавшую конечность одеялом, одеждой («сухое тепло») и дать теплое питье"],"answer":2},{"id":174,"section":"Первая помощь","q":"Какие действия осуществляются для оказания первой помощи при перегреве (солнечном ударе)?","options":["Положить пострадавшего, избавить его от одежды, укрыть в тень, дать выпить холодный напиток, положить холод на область сердца, обтереть спиртом","Положить пострадавшего, избавить его от одежды, укрыть в тень, обтереть спиртом, дать охлажденный легкий алкогольный напиток, вызвать «Скорую помощь»","Поместить пострадавшего в тень, вызвать «Скорую помощь», избавить его от одежды, обтереть влажным полотенцем, дать обильное нехолодное питье, в область подмышек и паховых складок влажные тряпки или холод, на лоб влажную тряпку"],"answer":2},{"id":175,"section":"Первая помощь","q":"Каковы действия по оказанию первой помощи при термических ожогах?","options":["Смазать маслом, кремом, промыть водой","Снять обгоревшую одежду, вскрыть пузыри, наложить повязку","Освободить от одежды обожженную часть тела (за исключением присохших фрагментов), пузыри не вскрывать, ничем не смазывать, покрыть чистым увлаженным материалом (наложить стерильную повязку)"],"answer":2},{"id":176,"section":"Первая помощь","q":"Каковы действия по оказанию первой помощи при химических ожогах?","options":["Обильно промыть струей воды и нейтрализовать (кислоту – слабым раствором щелочи, щелочь – слабым раствором кислоты)","Обильно промыть струей воды. Наложить увлажненную повязку","Протереть тампоном, смоченным спиртосодержащей жидкостью"],"answer":0},{"id":177,"section":"Первая помощь","q":"В каких случаях следует обратиться в медицинское учреждение для профилактики столбняка после оказания первой помощи при ранении?","options":["Только при укушенных или огнестрельных ранах","Только в тех случаях, когда рана или ранящий предмет имели непосредственный контакт с почвой","При любых ранениях"],"answer":2},{"id":178,"section":"Первая помощь","q":"Оказывая первую помощь при носовом кровотечении, необходимо:","options":["Запрокинуть голову пострадавшего назад, холод на переносицу","Нагнуть максимально голову пострадавшего, холод на переносицу","Уложить пострадавшего на живот на ровную поверхность, голову свесить с опоры, на которой лежит пострадавший"],"answer":1},{"id":179,"section":"Первая помощь","q":"Положение пострадавшего при проведении сердечно-легочной реанимации:","options":["На спине, на ровной жесткой поверхности (колени реанимирующего на уровне спины пострадавшего)","В том положении, в котором был обнаружен пострадавший (колени реанимирующего выше уровня спины пострадавшего)","На спине на кровати (колени реанимирующего ниже уровня спины пострадавшего)"],"answer":0},{"id":180,"section":"Первая помощь","q":"При проведении ИВЛ (искусственной вентиляции легких) методом «рот в рот» необходимо:","options":["Свободной рукой плотно зажимать нос пострадавшего","Зажимать нос пострадавшего только в случае, если носовые ходы свободны","Нос пострадавшему не зажимать"],"answer":0},{"id":181,"section":"Первая помощь","q":"При проведении ИВЛ (искусственной вентиляции легких) методом «рот в нос» необходимо:","options":["Свободной рукой открывать рот пострадавшего для обеспечения выдоха","Свободной рукой плотно удерживать нижнюю челюсть пострадавшего, чтобы его рот был закрыт","Не проводить никаких манипуляций с нижней челюстью пострадавшего"],"answer":1},{"id":182,"section":"Первая помощь","q":"Особенности проведения ИВЛ (искусственной вентиляции легких) детям:","options":["Частота вдуваний воздуха и объем вдуваемого воздуха, по сравнению со взрослыми пострадавшими, не меняется","Увеличивается частота вдуваний воздуха с обязательным уменьшением объема вдуваемого воздуха","Уменьшается частота вдуваний воздуха с обязательным уменьшением объема вдуваемого воздуха"],"answer":1},{"id":183,"section":"Первая помощь","q":"Частота вдуваний воздуха в минуту при проведении ИВЛ (искусственной вентиляции легких) составляет:","options":["6-8 вдуваний в минуту для взрослых, 8-10 для детей","8-10 вдуваний в минуту для взрослых, 12-20 для детей","20-24 вдуваний в минуту для взрослых, 30-36 для детей"],"answer":1},{"id":184,"section":"Первая помощь","q":"Ритм сердечно-легочной реанимации, выполняемой одним лицом, оказывающим помощь:","options":["5 надавливаний на грудную клетку – 1 вдувание воздуха","15 надавливаний на грудную клетку – 2 вдувания воздуха","30 надавливаний на грудную клетку – 2 вдувания воздуха"],"answer":2},{"id":185,"section":"Первая помощь","q":"Ритм сердечно-легочной реанимации, выполняемой двумя реанимирующими:","options":["5 надавливаний на грудную клетку – 1 вдувание воздуха","30 надавливаний на грудную клетку – 2 вдувания воздуха","15 надавливаний на грудную клетку – 2 вдувания воздуха"],"answer":1},{"id":186,"section":"Первая помощь","q":"Какое количество воды необходимо для эффективного промывания желудка взрослого человека при отравлениях?","options":["Не менее 3-6 литров воды","Не менее 10-12 литров воды","Количество воды потребное для появления чистых промывных вод"],"answer":1},{"id":187,"section":"Первая помощь","q":"В каких случаях при оказании первой помощи при отравлении промывание желудка «ресторанным методом» (когда пострадавшему дают воду с добавлением поваренной соли и вызывают рвоту) запрещено?","options":["При отравлениях медикаментами, несъедобными грибами и ягодами, недоброкачественными продуктами","При отравлениях кислотами, щелочами, нефтепродуктами, при судорогах, в случае потери сознания пострадавшим","При отравлениях у несовершеннолетних детей"],"answer":1}]</script>

  var shots = document.getElementById('shots');

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem('boo.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('boo.'+k,JSON.stringify(v)); }catch(e){} }
  };

  var S = {
    picked: store.get('sections', SECTIONS.slice()),
    wrong: store.get('wrong', []),
    mode:null, list:[], i:0, answered:false, log:[]
  };

  function pool(){ return Q.filter(function(q){ return S.picked.indexOf(q.section)>=0; }); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function drawShots(){
    shots.innerHTML='';
    S.log.slice(-12).forEach(function(e,n){
      var seed=(n*137.5)*Math.PI/180;
      var r = e.ok ? 2+((n*7)%4) : 9+((n*5)%8);
      var x=20+Math.cos(seed)*r, y=20+Math.sin(seed)*r;
      var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',x.toFixed(1)); c.setAttribute('cy',y.toFixed(1)); c.setAttribute('r','1.9');
      c.setAttribute('fill', e.ok?'#1E874B':'#C62B45');
      shots.appendChild(c);
    });
  }
  function head(){
    if(!S.mode){ counter.textContent=''; bar.style.width='0'; shots.innerHTML=''; return; }
    counter.innerHTML='<b>'+(S.i+ (S.answered?1:0))+'</b> / '+S.list.length;
    bar.style.width=(100*(S.i+(S.answered?1:0))/S.list.length)+'%';
    drawShots();
  }

  function menu(){
    S.mode=null; S.log=[]; head();
    var p=pool(), wrongN=Q.filter(function(q){return S.wrong.indexOf(q.id)>=0;}).length;
    var h='<h1>Тренажёр по безопасному обращению с оружием</h1>'+
      '<p class="lede">'+Q.length+' вопросов из базы учебного центра. Работает без интернета — можно добавить на домашний экран.</p>'+
      '<h2>Разделы</h2><div class="chips">';
    SECTIONS.forEach(function(s){
      var n=Q.filter(function(q){return q.section===s;}).length;
      h+='<button class="chip" data-sec="'+esc(s)+'" aria-pressed="'+(S.picked.indexOf(s)>=0)+'">'+esc(s)+'<span class="n num">'+n+'</span></button>';
    });
    h+='</div><h2>Режим</h2><div class="modes">'+
      mode('exam','Экзамен','10 случайных вопросов, допускается одна ошибка — как на аттестации',p.length<10)+
      mode('marathon','Марафон','Все '+p.length+' вопросов подряд, проверка сразу',p.length===0)+
      mode('wrong','Работа над ошибками', wrongN?wrongN+' вопросов, где вы ошибались':'Пока пусто — ошибки копятся сами', wrongN===0)+
      mode('study','Изучение','Просмотр вопросов с правильными ответами',p.length===0)+
      '</div>'+
      '<footer>База: «Вопросы БОО» СК «Северный десант», 133 основных вопроса плюс блок первой помощи. '+
      'Три вопроса помечены — там база разошлась с редакцией закона после 236-ФЗ от 04.07.2026.'+
      (S.wrong.length?' · <a href="#" id="reset" style="color:var(--muted)">Сбросить статистику ошибок</a>':'')+'</footer>';
    app.innerHTML=h; window.scrollTo(0,0);

    [].forEach.call(app.querySelectorAll('.chip'),function(b){
      b.onclick=function(){
        var s=b.dataset.sec, k=S.picked.indexOf(s);
        if(k>=0){ if(S.picked.length>1) S.picked.splice(k,1); } else S.picked.push(s);
        store.set('sections',S.picked); menu();
      };
    });
    [].forEach.call(app.querySelectorAll('.mode'),function(b){
      if(!b.disabled) b.onclick=function(){ start(b.dataset.m); };
    });
    var r=document.getElementById('reset');
    if(r) r.onclick=function(e){ e.preventDefault(); S.wrong=[]; store.set('wrong',[]); menu(); };
  }
  function mode(k,t,d,dis){
    return '<button class="mode" data-m="'+k+'"'+(dis?' disabled':'')+'>'+
      '<span class="k num">'+({exam:'10',marathon:'∞',wrong:'!',study:'≡'}[k])+'</span>'+
      '<span><span class="t">'+t+'</span><span class="d">'+esc(d)+'</span></span></button>';
  }

  function start(m){
    S.mode=m; S.i=0; S.answered=false; S.log=[];
    var p=pool();
    if(m==='exam') S.list=shuffle(p).slice(0,10);
    else if(m==='wrong') S.list=shuffle(Q.filter(function(q){return S.wrong.indexOf(q.id)>=0;}));
    else if(m==='study') S.list=p;
    else S.list=shuffle(p);
    if(m==='study') study(); else ask();
  }

  function ask(){
    var q=S.list[S.i]; S.answered=false; head();
    var h='<div class="q">'+esc(q.q)+'</div><div class="opts">';
    q.options.forEach(function(o,n){
      h+='<button class="opt" data-n="'+n+'"><span class="i num">'+(n+1)+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div><div id="after"></div>';
    app.innerHTML=h; window.scrollTo(0,0);
    [].forEach.call(app.querySelectorAll('.opt'),function(b){ b.onclick=function(){ answer(parseInt(b.dataset.n,10)); }; });
  }

  function answer(n){
    if(S.answered) return;
    S.answered=true;
    var q=S.list[S.i], ok=(n===q.answer);
    S.log.push({id:q.id,ok:ok});
    if(!ok){ if(S.wrong.indexOf(q.id)<0){ S.wrong.push(q.id); store.set('wrong',S.wrong); } }
    else if(S.mode==='wrong'){ var k=S.wrong.indexOf(q.id); if(k>=0){ S.wrong.splice(k,1); store.set('wrong',S.wrong); } }
    [].forEach.call(app.querySelectorAll('.opt'),function(b){
      var i=parseInt(b.dataset.n,10); b.disabled=true;
      if(i===q.answer) b.dataset.s='hit';
      else if(i===n) b.dataset.s='miss';
    });
    var h='';
    if(q.note) h+='<div class="note"><b>Закон изменился</b>'+esc(q.note)+'</div>';
    h+='<div class="act">'+
       '<button class="btn" id="next">'+(S.i+1<S.list.length?'Дальше':'Итог')+'</button>'+
       '<button class="btn ghost" id="quit">Выйти</button></div>';
    document.getElementById('after').innerHTML=h;
    head();
    document.getElementById('next').onclick=function(){
      S.i++; if(S.i<S.list.length) ask(); else finish();
    };
    document.getElementById('quit').onclick=menu;
    document.getElementById('next').focus();
  }

  function finish(){
    var ok=S.log.filter(function(e){return e.ok;}).length, bad=S.log.length-ok;
    var pass = S.mode==='exam' ? bad<=1 : bad===0;
    var h='<div class="result">';
    if(S.mode==='exam') h+='<div class="verdict '+(pass?'ok':'no')+'">'+(pass?'Зачёт':'Незачёт')+'</div>';
    else h+='<div class="verdict '+(pass?'ok':'no')+'">Готово</div>';
    h+='<div class="score num">'+ok+' из '+S.log.length+' верно'+(S.mode==='exam'?' · допускается одна ошибка':'')+'</div></div>';
    if(bad){
      h+='<h2>Разбор ошибок</h2>';
      S.log.forEach(function(e){
        if(e.ok) return;
        var q=Q.filter(function(x){return x.id===e.id;})[0];
        h+='<div class="review"><div class="q">'+esc(q.q)+'</div>'+
           '<div class="a">Верно: <b>'+esc(q.options[q.answer])+'</b></div>'+
           (q.note?'<div class="note"><b>Закон изменился</b>'+esc(q.note)+'</div>':'')+'</div>';
      });
    }
    h+='<div class="act"><button class="btn" id="again">Ещё раз</button>'+
       '<button class="btn ghost" id="back">В меню</button></div>';
    app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById('again').onclick=function(){ start(S.mode); };
    document.getElementById('back').onclick=menu;
  }

  function study(){
    head();
    var h='<h1>Изучение</h1><p class="lede">'+S.list.length+' вопросов, правильный ответ выделен.</p>';
    S.list.forEach(function(q,n){
      h+='<div class="review"><div class="q"><span class="num" style="color:var(--muted)">'+(n+1)+'. </span>'+esc(q.q)+'</div>'+
         '<div class="a">Верно: <b>'+esc(q.options[q.answer])+'</b></div>'+
         (q.note?'<div class="note"><b>Закон изменился</b>'+esc(q.note)+'</div>':'')+'</div>';
    });
    h+='<div class="act"><button class="btn ghost" id="back">В меню</button></div>';
    app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById('back').onclick=menu;
  }

  menu();
})();
</script>
</body>
</html>
