<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<title>БОО — тренажёр</title>
<style>
  :root{
    --paper:#F4F6F8; --card:#FFFFFF; --card2:#EDF1F5; --line:#DCE3EA;
    --ink:#122029; --muted:#64788A; --blaze:#E85D04;
    --hit:#1E874B; --miss:#C62B45;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:400 17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:660px;margin:0 auto;padding:0 16px}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  header{border-bottom:1px solid var(--line);background:rgba(244,246,248,.94);backdrop-filter:saturate(1.4) blur(8px);position:sticky;top:0;z-index:10}
  .hbar{display:flex;align-items:center;gap:14px;padding:12px 0}
  .brand{font-weight:800;letter-spacing:-.02em;text-transform:uppercase;font-size:15px;line-height:1.1}
  .brand span{display:block;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.08em;margin-top:3px}
  .spacer{flex:1}
  .counter{font-size:14px;color:var(--muted)}
  .counter b{color:var(--ink);font-weight:700}
  .bar{height:2px;background:var(--line)}
  .bar i{display:block;height:100%;background:var(--blaze);width:0;transition:width .25s}

  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:26px 0 6px}
  .lede{color:var(--muted);margin:0 0 22px;font-size:15px}
  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:26px 0 10px}

  .modes{display:grid;gap:10px}
  .mode{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;color:inherit;font:inherit;cursor:pointer}
  .mode:hover{border-color:#B6C3CE}
  .mode:active{transform:translateY(1px)}
  .mode .k{font-size:12px;letter-spacing:.06em;color:var(--blaze);font-weight:700;padding-top:3px;min-width:26px}
  .mode .t{display:block;font-weight:600}
  .mode .d{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.4}
  .mode[disabled]{opacity:.4;cursor:default}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:999px;padding:8px 14px;font:600 14px/1 inherit;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{opacity:.6;font-weight:500;margin-left:7px;font-size:13px}

  .q{margin:22px 0 18px;font-size:19px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
  .opts{display:grid;gap:9px}
  .opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px;color:inherit;font:inherit;cursor:pointer;min-height:56px}
  .opt:hover:not([disabled]){border-color:#B6C3CE}
  .opt .i{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid #C3CED8;
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .opt[data-s="hit"]{border-color:var(--hit);background:rgba(30,135,75,.08)}
  .opt[data-s="hit"] .i{background:var(--hit);border-color:var(--hit);color:#fff}
  .opt[data-s="miss"]{border-color:var(--miss);background:rgba(198,43,69,.07)}
  .opt[data-s="miss"] .i{background:var(--miss);border-color:var(--miss);color:#fff}
  .opt[disabled]{cursor:default}

  .note{margin-top:16px;border-left:3px solid var(--blaze);background:#FFF4EC;border-radius:0 6px 6px 0;
    padding:11px 14px;color:#6B4526;font-size:14px}
  .note b{color:var(--blaze);display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .src{margin-top:14px;color:var(--muted);font-size:13px}

  .act{display:flex;gap:10px;margin:22px 0 34px}
  .btn{flex:1;background:var(--blaze);color:#fff;border:0;border-radius:var(--r);
    padding:15px;font:700 16px/1 inherit;cursor:pointer;letter-spacing:.01em}
  .btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}

  .result{text-align:center;padding:14px 0 0}
  .verdict{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:16px 0 4px}
  .verdict.ok{color:var(--hit)} .verdict.no{color:var(--miss)}
  .score{color:var(--muted);font-size:15px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
  td:first-child{width:34px;color:var(--ink)}
  tr.miss td:first-child{color:var(--miss)}

  .review{border-top:1px solid var(--line);padding:18px 0}
  .review .q{font-size:16px;margin:0 0 10px}
  .review .a{font-size:15px;color:var(--muted)}
  .review .a b{color:var(--hit);font-weight:600}
  footer{color:var(--muted);font-size:13px;padding:26px 0 34px;border-top:1px solid var(--line);margin-top:20px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--blaze);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="wrap hbar">
    <svg id="target" width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="none" stroke="#C9D4DD"/>
      <circle cx="20" cy="20" r="13" fill="none" stroke="#C9D4DD"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#C9D4DD"/>
      <circle cx="20" cy="20" r="1.6" fill="#C9D4DD"/>

    </svg>
    <div class="brand">Безопасное обращение<span>СК «Северный десант» · Нижневартовск</span></div>
    <div class="spacer"></div>
    <div class="counter num" id="counter"></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main class="wrap" id="app"></main>

 лицензия на приобретение оружия не выдается гражданам Российской Федерации:","options":["Не имеющим медицинского заключения об отсутствии медицинских противопоказаний к владению оружием и медицинского заключения об отсутствии в организме человека наркотических средств, психотропных веществ и их метаболитов","Не представившим медицинского заключения об отсутствии медицинских противопоказаний к владению оружием (при этом представление отдельного медицинского заключения об отсутствии в организме человека наркотических средств, психотропных веществ и их метаболитов не требуется)","Не представившим медицинского заключения об отсутствии медицинских противопоказаний к управлению транспортным средством (вместе с медицинским заключением об отсутствии в организме человека наркотических средств, психотропных веществ и их метаболитов)"],"answer":0},{"id":6,"section":"Правовая подготовка","q":"Обязаны ли граждане (за исключением специально уполномоченных лиц), являющиеся пассажирами воздушного судна гражданской авиации, сдавать имеющееся у них оружие уполномоченным лицам для временного хранения на период полета?","options":["Обязаны во всех случаях","Обязаны, кроме случаев, когда оружие находится в его багаже","Не обязаны"],"answer":0},{"id":7,"section":"Правовая подготовка","q":"При необходимой обороне субъектом посягательства, отражаемого обороняющимся, является:","options":["Человек (физическое лицо).","Стихия (силы природы).","Источник повышенной опасности (оружие, автомобиль и пр.)."],"answer":0},{"id":8,"section":"Правовая подготовка","q":"Могут ли действия граждан по защите других лиц расцениваться как действия в состоянии необходимой обороны:","options":["Не могут ни при каких условиях.","Могут, если соблюдены условия необходимой обороны, предусмотренные законом.","Могут только в случаях непосредственной угрозы жизни."],"answer":1},{"id":9,"section":"Правовая подготовка","q":"Допускается ли причинение вреда третьим лицам в состоянии необходимой обороны?","options":["Да, в сфере оборота оружия, по месту применения оружия","Незамедлительно, но не позднее 6 часов, прокурору, в органы здравоохранения, в орган внутренних дел и территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия, по месту применения оружия"],"answer":1},{"id":16,"section":"Правовая подготовка","q":"Обязан ли гражданин незамедлительно информировать орган внутренних дел и территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия, в случае, если он применил оружие для производства предупредительного выстрела?","options":["Обязан информировать орган внутренних дел и территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия, по месту применения оружия","Не обязан, поскольку нет пострадавших","Обязан информировать орган внутренних дел и территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия, по месту регистрации оружия"],"answer":0},{"id":17,"section":"Правовая подготовка","q":"Правилами оборота гражданского и служебного оружия на территории Российской Федерации предусмотрено, что досылание патрона в патронник разрешается:","options":["Только при необходимости применения оружия либо для защиты жизни, здоровья и собственности в состоянии необходимой обороны или крайней необходимости","При необходимости применения оружия, а также в любых других опасных ситуациях","При необходимости применения оружия, а также при охране денежных средств и ценных грузов"],"answer":0},{"id":18,"section":"Правовая подготовка","q":"На основании Правил оборота гражданского и служебного оружия на территории Российской Федерации граждане, осуществляющие ношение оружия, должны иметь при себе:","options":["Документы, удостоверяющие их личность, паспорт на оружие от предприятия-производителя","Выданное Федеральной службой войск национальной гвардии Российской Федерации или ее территориальным органом лицензию либо разрешение на хранение и ношение имеющегося у них оружия, медицинские справки формы 002-О/у и 003-О/у","Документы, удостоверяющие их личность, а также выданные Федеральной службой войск национальной гвардии Российской Федерации или ее территориальным органом лицензию либо разрешение на хранение и ношение имеющегося у них оружия"],"answer":2},{"id":19,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» к основным частям огнестрельного оружия относятся:","options":["Ствол, затвор, барабан, рамка, ствольная коробка","Ствол, затворная рама, крышка ствольной коробки, приклад, рукоятка","Ствол, магазин, барабан, рамка, ствольная коробка, патрон"],"answer":0},{"id":20,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» к огнестрельному оружию ограниченного поражения относится:","options":["Короткоствольное оружие и длинноствольное оружие, предназначенные для механического поражения живой цели на расстоянии метаемым снаряжением патрона травматического действия, получающим направленное движение за счет энергии порохового или иного заряда, и не предназначенные для причинения смерти человеку","Короткоствольное оружие и бесствольное оружие, предназначенные для механического поражения живой цели на расстоянии метаемым снаряжением патрона травматического действия, получающим направленное движение за счет энергии порохового или иного заряда, и не предназначенные для причинения смерти человеку","Короткоствольное, длинноствольное оружие и бесствольное оружие, предназначенные для механического поражения живой цели на расстоянии метаемым снаряжением патрона травматического действия, получающим направленное движение за счет энергии порохового или иного заряда, и не предназначенные для причинения смерти человеку"],"answer":1},{"id":21,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» к газовому оружию относится:","options":["Оружие, предназначенное для поражения цели на расстоянии снарядом, получающим направленное движение за счет энергии сжатого, сжиженного или отвержденного газа","Оружие, предназначенное для временного поражения живой цели путем применения слезоточивых, раздражающих веществ, или патронов травматического действия","Оружие, предназначенное для временного химического поражения живой цели путем применения слезоточивых или раздражающих веществ"],"answer":2},{"id":22,"section":"Правовая подготовка","q":"В соответствии с Гражданским кодексом Российской Федерации вред, причиненный в состоянии необходимой обороны:","options":["Подлежит возмещению, только если превышает установленный законом минимальный размер оплаты труда","Не подлежит возмещению, если при этом не были превышены пределы необходимой обороны","В любом случае подлежит возмещению лицом, причинившим вред"],"answer":1},{"id":23,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» общее количество приобретенного гражданином Российской Федерации огнестрельного оружия ограниченного поражения (за исключением случаев, если указанное оружие является объектом коллекционирования) не должно превышать:","options":["Две единицы","Три единицы","Пять единиц"],"answer":0},{"id":24,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» гражданам Российской Федерации не разрешается иметь в собственности свыше следующего общего количества огнестрельного гладкоствольного длинноствольного оружия, охотничьего огнестрельного гладкоствольного длинноствольного оружия и охотничьего огнестрельного длинноствольного оружия с нарезным стволом (если оно не является предметом коллекционирования):","options":["Две единицы","Пятнадцать единиц","Десять единиц"],"answer":2},{"id":25,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» по лицензии на приобретение газовых пистолетов, револьверов допускается их регистрация в количестве:","options":["Не более двух единиц","Не более трех единиц","Не более пяти единиц"],"answer":2},{"id":26,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» лицензия на приобретение оружия не выдается гражданам Российской Федерации, повторно привлеченным в течение года к административной ответственности:","options":["За совершение любого административного правонарушения","За совершение административного правонарушения, посягающего на институты государственной власти, либо административного правонарушения, посягающего на права граждан","За совершение административного правонарушения, посягающего на общественный порядок и общественную безопасность или установленный порядок управления, административного правонарушения, связанного с нарушением правил охоты, либо административного правонарушения в области оборота наркотических средств, психотропных веществ, их аналогов или прекурсоров, растений, содержащих наркотические средства или психотропные вещества либо их прекурсоры, или их частей, содержащих наркотические средства или психотропные вещества либо их прекурсоры, за исключением административных правонарушений, связанных с потреблением наркотических средств или психотропных веществ без назначения врача либо новых потенциально опасных психоактивных веществ, - до окончания срока, в течение которого лицо считается подвергнутым административному наказанию"],"answer":2},{"id":27,"section":"Правовая подготовка","q":"За стрельбу из оружия в отведенных для этого местах с нарушением установленных [правил](consultantplus://offline/ref%3D256E52B086EC05681BBAE63906D71A9FE7AEB519D5D6E83EEDE7901C633C4ACB5B0ACE7905862Bl06BS):","options":["Не предусмотрено административного наказания","Предусмотрено предупреждение или наложение административного штрафа","Предусмотрено наложение административного штрафа с конфискацией оружия и патронов к нему или без таковой"],"answer":2},{"id":28,"section":"Правовая подготовка","q":"Федеральным законом «Об оружии» предусмотрена регистрация приобретенного огнестрельного оружия, огнестрельного оружия о олнительной власти, осуществляющем функции в сфере деятельности войск национальной гвардии Российской Федерации, или его территориальном органе при изменении гражданином постоянного места жительства, влечет:","options":["Уголовную ответственность","Административную ответственность","Гражданско-правовую ответственность"],"answer":1},{"id":32,"section":"Правовая подготовка","q":"За стрельбу из оружия в населенных пунктах или в других не отведенных для этого местах:","options":["Не предусмотрено административного наказания","Предусмотрено предупреждение или наложение административного штрафа","Предусмотрено наложение административного штрафа с конфискацией оружия и патронов к нему либо лишение права на приобретение и хранение или хранение и ношение оружия на срок от полутора до трех лет с конфискацией оружия и патронов к нему"],"answer":2},{"id":33,"section":"Правовая подготовка","q":"Результаты прохождения проверки знания правил безопасного обращения с оружием и наличия навыков безопасного обращения с оружием оформляются:","options":["Актом прохождения проверки","Свидетельством о прохождении проверки","Экзаменационным листом"],"answer":0},{"id":34,"section":"Правовая подготовка","q":"Лицензия на приобретение оружия и разрешение на хранение или хранение и ношение оружия аннулируются:","options":["Органами местного самоуправления.","Органами, уполномоченные на выдачу охотничьих билетов.","Органами, выдавшими эти лицензию и (или) разрешение."],"answer":2},{"id":35,"section":"Правовая подготовка","q":"Проверка знания правил безопасного обращения с оружием и наличия навыков безопасного обращения с оружием владельцами огнестрельного оружия ограниченного поражения, газовых пистолетов, револьверов, гражданского огнестрельного гладкоствольного длинноствольного оружия самообороны проводится:","options":["Не реже одного раза в год","Не реже одного раза в три года","Не реже одного раза в пять лет"],"answer":2},{"id":36,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» за продлением разрешения на хранение огнестрельного гладкоствольного длинноствольного оружия самообороны, разрешения на хранение и ношение охотничьего огнестрельного длинноствольного оружия, спортивного огнестрельного длинноствольного оружия, пневматического оружия или огнестрельного оружия ограниченного поражения, разрешения на хранение и использование на стрелковом объекте спортивного огнестрельного короткоствольного оружия с нарезным стволом гражданин Российской Федерации обязан обратиться:","options":["Не ранее чем за шесть месяцев и не позднее чем за один месяц до дня окончания срока его действия","Не ранее чем за шесть месяцев и не позднее чем за два месяца до дня окончания срока его действия","Не ранее чем за три месяца и не позднее чем за один месяц до дня окончания срока его действия"],"answer":0},{"id":37,"section":"Правовая подготовка","q":"При выдаче новых лицензий и разрешений ранее полученные, с истекшим сроком действия:","options":["Остаются у владельца оружия","Подлежат сдаче в территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия.","Подлежат сдаче в территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия, только если выдавались на огнестрельное оружие."],"answer":1},{"id":38,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» дульная энергия при выстреле из гражданского огнестрельного гладкоствольного длинноствольного оружия патронами травматического действия:","options":["Не должна превышать 150 Дж","Не должна превышать 91 Дж","Не должна превышать 80 Дж"],"answer":0},{"id":39,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» дульная энергия при выстреле из гражданского огнестрельного оружия ограниченного поражения патронами травматического действия:","options":["Не должна превышать 150 Дж","Не должна превышать 91 Дж","Не должна превышать 80 Дж"],"answer":1},{"id":40,"section":"Правовая подготовка","q":"Возраст, по достижении которого граждане Российской Федерации имеют право на приобретение охотничьего огнестрельного гладкоствольного длинноствольного оружия:","options":["Может быть снижен не более чем на два года по решению законодательного (представительного) органа государственной власти субъекта Российской Федерации","Может быть снижен не более чем на один год по решению законодательного (представительного) органа государственной власти субъекта Российской Федерации","Не может быть снижен."],"answer":0},{"id":41,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» огнестрельное оружие ограниченного поражения иностранного производства, его основные части, а также патроны травматического действия, изготовленные за пределами территории Российской Федерации:","options":["Подлежат ввозу в Российскую Федерацию, если их технические характеристики соответствуют аналогичным моделям отечественного производства.","Подлежат ввозу в Российскую Федерацию.","Не подлежат ввозу в Российскую Федерацию."],"answer":2},{"id":42,"section":"Правовая подготовка","q":"В случае изменения места жительства гражданин Российской Федерации обязан обратиться с заявлением о постановке на учет принадлежащего ему оружия:","options":["В территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по прежнему месту жительства в двухнедельный срок со дня регистрации.","В соответствующий территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по новому месту жительства в двухнедельный срок со дня регистрации.","В территориальные органы федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по прежнему, а также по новому месту жительства, в течении месяца со дня регистрации."],"answer":1},{"id":43,"section":"Правовая подготовка","q":"Оружие, находящееся на законных основаниях на праве личной собственности у гражданина Российской Федерации может быть продано другому гражданину, имеющему лицензию на приобретение оружия, его коллекционирование или экспонирование:","options":["После перерегистрации оружия в федеральном органе исполнительной власти, уполномоченном в сфере оборота оружия, или его территориальном органе по месту жительства лица, приобретающего оружие.","После внесения записи о перерегистрации оружия в лицензию нового владельца самим гражданином, продающим оружие.","После перерегистрации оружия в федеральном органе исполнительной власти, уполномоченном в сфере оборота оружия, или его территориальном органе по месту учета указанного оружия."],"answer":2},{"id":44,"section":"Правовая подготовка","q":"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, принадлежащие гражданам Российской Федерации оружие и патроны по месту их проживания:","options":["Должны храниться с соблюдением условий, обеспечивающих их сохранность, безопасность хранения и исключающих доступ к ним посторонних лиц, в запирающихся на замок (замки) сейфах, сейфовых шкафах или металлических шкафах для хранения оружия, ящиках из высокопрочных материалов либо в деревянных ящиках, обитых железом.","Должны храниться с соблюдением условий, обеспечивающих их сохранность, безопасность хранения и исключающих доступ к ним посторонних лиц, в любых запирающихся на замок ящиках.","Хранятся в произвольном порядке."],"answer":0},{"id":45,"section":"Правовая подготовка","q":"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, хранение оружия и патронов гражданами Российской Федерации в местах временного пребывания:","options":["Должно осуществляться с соблюдением условий, исключающих доступ к оружию посторонних лиц.","Должно осуществляться с соблюдением условий, исключающих доступ к оружию посторонних лиц и только в запирающихся на замок (замки) сейфах или металлических шкафах для хранения оружия, ящиках из высокопрочных материалов либо в деревянных ящиках, обитых железом.","Осуществляется в произвольном порядке."],"answer":0},{"id":46,"section":"Правовая подготовка","q":"Хранение оружия и патронов, принадлежащего гражданам Российской Федерации, являющихся членами спортивных стрелковых обществ и клубов на спортивных стрелково-стендовых объектах по месту проведения тренировочных стрельб и соревнований:","options":["Допускается.","Не допускается.","Допускается только при условии, что названные граждане являются спортсменами высокого класса."],"answer":0},{"id":47,"section":"Правовая подготовка","q":"К условиям, при которых граждане Российской Федерации, которые имеют охотничий билет, имеют право получать лицензию на приобретение охотничьего огнестрельного длинноствольного оружия с нарезным стволом, относятся, среди прочих, следующие:","options":["- занимаются профессиональной деятельностью, связанной с охотой; - владеют непрерывно не менее трех лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом.","- занимаются профессиональной деятельностью, связанной с охотой; - владеют непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом; - владеют охотничьим огнестрельным длинноствольным оружием с нарезным стволом на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, которое было приобретено на основании лицензии на приобретение такого оружия.","- занимаются правоохранительной деятельностью; - владеют непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом; - владеют охотничьим огнестрельным длинноствольным оружием с нарезным стволом на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, которое было приобретено на основании лицензии на приобретение такого оружия."],"answer":1,"note":"236-ФЗ от 04.07.2026 снизил срок с пяти лет до трёх. База центра этого не учитывает — на экзамене отвечайте по ключу."},{"id":48,"section":"Правовая подготовка","q":"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, транспортирование принадлежащего гражданам оружия:","options":["Осуществляется в произвольном порядке","Осуществляется в кобурах, чехлах; при их отсутствии - в ингибиторной бумаге","Осуществляется в чехлах, кобурах или специальных футлярах, а также в специальной упаковке производителя оружия"],"answer":2},{"id":49,"section":"Правовая подготовка","q":"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации (в части, регулирующей транспортирование принадлежащего гражданам оружия):","options":["Оружие при транспортировании должно быть разряженным только в случае транспортирования в специальной упаковке производителя оружия","Оружие при транспортировании должно находиться в разряженном состоянии отдельно от патронов","Оружие при транспортировании может находиться как в разряженном, так и в заряженном состоянии (по усмотрению владельца)"],"answer":1},{"id":50,"section":"Правовая подготовка","q":"При получении заявления о продлении срока действия разрешений на хранение (либо хранение и ношение) оружия, дата и время проверки уполномоченными сотрудниками обеспечения условий хранения (сохранности) оружия и патронов определяется в следующем порядке:","options":["В течение 2 рабочих дней со дня регистрации заявления сотрудник по согласованию с вышестоящим руководством определяет дату и время проверки, о которых заявитель оповещается по его контактным телефонам либо по электронной почте","В течение 2 рабочих дней со дня регистрации заявления сотрудник самостоятельно определяет дату и время проверки, о которых заявитель оповещается по его контактным телефонам либо по электронной почте","В течение 2 рабочих дней со дня регистрации заявления сотрудником совместно с заявителем по контактным телефонам либо путем переписки по электронной почте определяются дата и время проверки"],"answer":2},{"id":51,"section":"Правовая подготовка","q":"Имеют ли право на необходимую оборону лица, имеющие возможность избежать общественно опасного посягательства или обратиться за помощью к другим лицам или органам власти?","options":["Да, имеют","Нет, не имеют","Имеют, если посягательство сопряжено с насилием, опасным для жизни обороняющегося"],"answer":0},{"id":52,"section":"Правовая подготовка","q":"Правилами оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации установлен следующий порядок ношения огнестрельного короткоствольного оружия:","options":["В кобуре, со снаряженным магазином или барабаном, поставленным на предохранитель (при наличии)","В кобуре, с патроном в патроннике, со взведенным курком","В кобуре, с патроном в патроннике, поставленным на предохранитель (при наличии)"],"answer":0},{"id":53,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации ношение гражданами в целях самообороны огнестрельного длинноствольного оружия, холодного оружия и метательного стрелкового оружия:","options":["Разрешается на территории того субъекта Российской Федерации, в котором проживает владелец указанного оружия","Разрешается на всей территории Российской Федерации","Запрещается, за исключением случаев перевозки или транспортирования указанного оружия"],"answer":2},{"id":54,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие (за исключением спортивного оружия) должно иметь емкость магазина (барабана):","options":["Не более 8 патронов","Не более 10 патронов","Не более 12 патронов"],"answer":1},{"id":55,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие:","options":["Должно исключать ведение огня очередями","Может вести огонь очередями","Может вести огонь очередями только в случае, когда оно является охотничьим"],"answer":0},{"id":56,"section":"Правовая подготовка","q":"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, граждане Российской Федерации осуществляют ношение и использование оружия (с учетом ограничений, установленных Федеральным законом «Об оружии»):","options":["Во время охоты, проведения спортивных мероприятий, тренировочных и учебных стрельб, а также в целях самообороны.","Во время охоты, проведения спортивных мероприятий, тренировочных и учебных стрельб.","Только во время охоты и в целях самообороны."],"answer":0},{"id":57,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» осмотр врачом-психиатром и врачом-психиатром- наркологом при проведении медицинского освидетельствования на наличие медицинских противопоказаний к владению оружием и химико-токсикологические исследования наличия в организме человека наркотических средств, психотропных веществ и их метаболитов осуществляется:","options":["В любых медицинских организациях.","В медицинских организациях государственной или муниципальной системы здравоохранения только по месту жительства гражданина Российской Федерации.","В медицинских организациях государственной или муниципальной системы здравоохранения по месту жительства (пребывания) гражданина Российской Федерации."],"answer":2},{"id":58,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» запрещается ношение огнестрельного оружия:","options":["На стрелковых объектах.","В состоянии опьянения.","За пределами субъекта Российской Федерации, где зарегистрировано огнестрельное оружие."],"answer":1},{"id":59,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» запрещается ношение гражданами огнестрельного оружия ограниченного поражения:","options":["На стрелковых объектах.","Во время нахождения в организациях, предназначенных для развлечения и досуга (независимо от времени их работы и факта реализации в них алкогольной продукции), за исключением случаев ношения такого оружия лицами, осуществляющими в соответствии с законодательством Российской Федерации охрану указанных организаций.","Во время нахождения в организациях, предназначенных для развлечения и досуга, осуществляющих работу в ночное время и реализующих алкогольную продукцию, за исключением случаев ношения такого оружия лицами, осуществляющими в соответствии с законодательством Российской Федерации охрану указанных организаций."],"answer":2},{"id":60,"section":"Правовая подготовка","q":"В соответствии с Кодексом РФ об административных правонарушениях нарушение правил охоты влечет для граждан:","options":["Наложение административного штрафа с конфискацией орудий охоты или без таковой или административный арест до 15 суток","Наложение административного штрафа с конфискацией орудий охоты или без таковой или лишение права осуществлять охоту на установленный законом срок","Только аннулирование (изъятие) охотничьего билета"],"answer":1},{"id":61,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие ограниченного поражения (пистолет, револьвер, огнестрельное бесствольное устройство отечественного производства) может использоваться:","options":["С патронами травматического действия, патронами газового действия и патронами светозвукового действия","С патронами травматического действия и патронами светозвукового действия","Только с патронами травматического действия"],"answer":0},{"id":62,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещен оборот в качестве гражданского оружия:","options":["Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от его казенной части или длину цельного ствола со ствольной коробкой менее 500 мм и общую длину оружия менее 800 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 800 мм и при этом не теряется возможность производства выстрела","Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от его казенной части или длину цельного ствола со ствольной коробкой менее 550 мм и общую длину оружия менее 850 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 850 мм и при этом не теряется возможность производства выстрела","Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от его казенной части или длину цельного ствола со ствольной коробкой менее 600 мм и общую длину оружия менее 900 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 900 мм и при этом не теряется возможность производства выстрела"],"answer":0},{"id":63,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается:","options":["Перевозка оружия","Пересылка оружия","Транспортирование оружия"],"answer":1},{"id":64,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","options":["Огнестрельного оружия, которое имеет камуфлированную раскраску","Огнестрельного оружия, содержащего комплектующие детали либо элементы, по виду сходные с комплектующими деталями либо элементами боевого оружия","Огнестрельного оружия, которое имеет форму, имитирующую другие предметы"],"answer":2},{"id":65,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается установка на гражданском оружии:","options":["Коллиматорных прицелов и лазерных целеуказателей, а также их продажа при отсутствии соответствующей лицензии на торговлю оружием","Приспособлений для бесшумной стрельбы и прицелов (прицельных комплексов) ночного видения, в том числе прицелов для охоты, порядок использования которых устанавливается Правительством Российской Федерации, а также их продажа","Приспособлений для бесшумной стрельбы и прицелов (прицельных комплексов) ночного видения, за исключением прицелов для охоты, порядок использования которых устанавливается Правительством Российской Федерации, а также их продажа"],"answer":2,"note":"236-ФЗ от 04.07.2026 убрал прицелы ночного видения из статьи 6. Точного соответствия новому закону среди вариантов нет — отвечайте по ключу."},{"id":66,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","options":["Патронов с пулями, или пуль, или метаемых снарядов к метательному стрелковому оружию бронебойного, зажигательного, разрывного или трассирующего действия, а также патронов с дробовыми снарядами для газовых пистолетов и револьверов","Патронов с пулями, или пуль, или метаемых снарядов к метательному стрелковому оружию бронебойного, зажигательного, разрывного или трассирующего действия, кроме используемых для охоты, а также патронов с дробовыми снарядами для газовых пистолетов и револьверов","Патронов светозвукового и травматического действия, а также патронов с дробовыми снарядами для охотничьего оружия"],"answer":0},{"id":67,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","options":["Газового оружия, снаряженного нервно-паралитическими, отравляющими, а также другими веществами, не разрешенными к применению федеральным органом исполнительной власти, осуществляющим функции по выработке государственной политики и нормативно-правовому регулированию в сфере здравоохранения","Газового оружия, снаряженного слезоточивыми или раздражающими веществами, разрешенными к применению федеральным органом исполнительной власти, осуществляющим функции по выработке государственной политики и нормативно-правовому регулированию в сфере здравоохранения","Газовых пистолетов и револьверов с емкостью магазина (барабана) более 8 патронов."],"answer":0},{"id":68,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается:","options":["Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением передачи патронов лицам, участвующим в совместной охоте с владельцем оружия и патронов","Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением передачи патронов лицам, занимающимся в спортивных организациях видами спорта, связанными с использованием огнестрельного оружия, или проходящим стрелковую подготовку в образовательных организациях","Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением случаев передачи патронов лицам, являющимся членами семьи и проживающим совместно с владельцем оружия и патронов"],"answer":1},{"id":69,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации не запрещается:","options":["Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, имеющим разрешения на хранение и ношение такого оружия","Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, не имеющим разрешения на хранение и ношение такого оружия, но участвующим в совместной охоте с лицами, имеющими соответствующие разрешения","Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, не имеющим разрешения на хранение и ношение такого оружия, но проживающим совместно с лицами, имеющими соответствующие разрешения"],"answer":0},{"id":70,"section":"Правовая подготовка","q":"Правилами охоты установлено, что проверка боя охотничьего оружия и приведение его к нормальному бою (далее - пристрелка) должна производиться:","options":["Только на специально оборудованных стрельбищах или площадках","На специально оборудованных стрельбищах или площадках, либо в охотничьих угодьях только в период охоты при наличии у охотника документов на право осуществления охоты","На специально оборудованных стрельбищах или площадках, либо в охотничьих угодьях (независимо от того, происходит ли это в период охоты)"],"answer":1},{"id":71,"section":"Правовая подготовка","q":"Требованиями охотничьего минимума установлено, что осуществление охоты не допускается:","options":["Ближе 15 метров от линий электропередач","В одежде ярких расцветок","В состоянии алкогольного, наркотического опьянения"],"answer":2},{"id":72,"section":"Правовая подготовка","q":"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается:","options":["Стрелять «на шум», «на шорох», по неясно видимой цели","Стрелять, если цель находится на возвышенности","Стрелять в болотистой местности"],"answer":0},{"id":73,"section":"Правовая подготовка","q":"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается осуществлять добычу охотничьих животных с применением охотничьего оружия ближе:","options":["100 метров от жилья","200 метров от жилья","300 метров от жилья"],"answer":1},{"id":74,"section":"Правовая подготовка","q":"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается:","options":["Стрелять по пернатой дичи, находящейся в стае","Стрелять по пернатой дичи, сидящей на нижних ветках деревьев","Стрелять по пернатой дичи, сидящей на проводах и опорах (столбах) линий электропередач"],"answer":2},{"id":75,"section":"Правовая подготовка","q":"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается стрелять вдоль линии стрелков, когда снаряд может пройти ближе:","options":["25 метров от соседнего стрелка","20 метров от соседнего стрелка","15 метров от соседнего стрелка"],"answer":2},{"id":76,"section":"Правовая подготовка","q":"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается организовывать загон охотничьих животных:","options":["При котором животных загоняют в направлении к реке или иному водоему","При котором охотники движутся внутрь загона, окружая оказавшихся в загоне животных","При котором загонщики используют какие-либо дополнительные средства производства шума, помимо собственного голоса"],"answer":1},{"id":77,"section":"Правовая подготовка","q":"Правилами охоты запрещается стрелять ниже 2,5 метров по взлетающей и летящей птице:","options":["При осуществлении охоты в зарослях, кустах и ограниченном обзоре местности","При любом осуществлении охоты, независимо от ее условий","При использовании полуавтоматического оружия"],"answer":0},{"id":78,"section":"Правовая подготовка","q":"Правилами охоты установлено, что при осуществлении охоты запрещается применение охотничьего огнестрельного гладкоствольного оружия для охоты на пернатую дичь:","options":["Снаряженного дробью (картечью) крупнее пяти миллиметров и пулями","Снаряженного дробью (картечью) крупнее четырех миллиметров и пулями","Снаряженного дробью (картечью) крупнее трех миллиметров и пулями"],"answer":0},{"id":79,"section":"Правовая подготовка","q":"Организациям, осуществляющим торговлю оружием и патронами к нему, не запрещается продавать инициирующие и воспламеняющие вещества и материалы (порох, капсюли) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию либо для заряжания оружия, имеющего культурную ценность, копий старинного (антикварного) огнестрельного оружия и реплик старинного (антикварного) огнестрельного оружия:","options":["Любым гражданам, достигшим возраста 18 лет","Гражданам, проходящим службу в государственных военизированных организациях и имеющим воинские звания либо специальные звания или классные чины юстиции (независимо от наличия у них разрешения на хранение и ношение гражданского огнестрельного длинноствольного оружия)","Гражданам, представившим разрешение на хранение и ношение гражданского огнестрельного длинноствольного оружия."],"answer":2},{"id":80,"section":"Правовая подготовка","q":"Не подлежат продаже вещества и материалы для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию:","options":["Произведенные за пределами Российской Федерации.","Упаковка которых не содержит сведений о правилах их безопасного использования для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию.","Вес упаковки которых превышает 100 гр."],"answer":1},{"id":81,"section":"Правовая подготовка","q":"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, право на приобретение гражданского огнестрельного оружия ограниченного поражения, охотничьего оружия, огнестрельного гладкоствольного длинноствольного оружия самообороны имеют:","options":["Граждане Российской Федерации, достигшие возраста 21 года (возможность б  истечения одного года со дня окончания срока, в течение которого лицо считается подвергнутым административному наказанию","До истечения шести месяцев со дня окончания срока, в течение которого лицо считается подвергнутым административному наказанию","До окончания срока, в течение которого лицо считается подвергнутым административному наказанию"],"answer":0},{"id":92,"section":"Правовая подготовка","q":"В соответствии с Федеральным законом «Об оружии» граждане Российской Федерации, имеющие охотничий билет и владевшие охотничьим огнестрельным длинноствольным оружием с нарезным стволом, которое было приобретено на основании лицензии на приобретение такого оружия или владевшие непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием, на основании соответствующих разрешений на его хранение и ношение, выданных федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, имеют право получать лицензию на приобретение охотничьего огнестрельного длинноствольного оружия с нарезным стволом, если со дня истечения срока действия указанного разрешения или его аннулирования на основании добровольного отказа гражданина от указанного разрешения прошло:","options":["Не более пяти лет.","Не более трех лет.","Не более одного года."],"answer":2,"note":"В формулировке вопроса пять лет, по действующему закону — три. На сам ответ (не более одного года) это не влияет."},{"id":93,"section":"Огневая подготовка","q":"Линией прицеливания называется:","options":["Линия, проходящая от центра ствола в точку прицеливания","Прямая линия, проходящая от глаза стрелка через середину прорези прицела (на уровне с ее краями) и вершину мушки в точку прицеливания","Линия, описываемая центром тяжести пули в полете"],"answer":1},{"id":94,"section":"Огневая подготовка","q":"Траекторией полета пули называется:","options":["Кривая линия, описываемая центром тяжести пули в полете","Прямая линия, проходящая от глаза стрелка через середину прорези прицела (на уровне с ее краями) и вершину мушки в точку прицеливания","Прямая линия от центра ствола до точки попадания"],"answer":0},{"id":95,"section":"Огневая подготовка","q":"Прямым выстрелом называется:","options":["Выстрел, при котором траектория полета пули поднимается над линией прицеливания выше цели не более, чем на одной трети своего протяжения","Выстрел, при котором ствол оружия и линия плеч стрелка составляют прямой угол","Выстрел, при котором траектория полета пули не поднимается над линией прицеливания выше цели на всем своем протяжении"],"answer":2},{"id":96,"section":"Огневая подготовка","q":"Каков порядок действий стрелка при проведении стрельб в тирах и на стрельбищах?","options":["Стрелок самостоятельно выходит на линию огня, по команде «Заряжай» заряжает оружие и по команде «Огонь» ведет огонь","Стрелок по команде «На линию огня» выходит на огневой рубеж, самостоятельно заряжает, стреляет","Стрелок выходит, заряжает, стреляет, производит иные действия только по мере получения отдельных команд"],"answer":2},{"id":97,"section":"Огневая подготовка","q":"В случае задержки при стрельбе из пистолета в тире необходимо:","options":["Осторожно вынуть магазин из основания рукоятки, устранить причину задержки, продолжить выполнение упражнения","Поставить оружие на предохранитель, вынуть магазин из основания рукоятки, сдать оружие руководителю стрельб (инструктору)","Не производить никаких действий с оружием и удерживая его в направлении мишени, доложить руководителю стрельб (инструктору) о задержке и действовать по его команде"],"answer":2},{"id":98,"section":"Огневая подготовка","q":"Как следует производить перезарядку огнестрельного гладкоствольного длинноствольного оружия с помповым механизмом?","options":["Быстрым движением цевья назад, и не задерживая в заднем положении, быстрым вперед","Медленно назад и быстро вперед","Быстро назад и медленно вперед"],"answer":0},{"id":99,"section":"Огневая подготовка","q":"Безопасное использование оружия предполагает в период непосредственного применения:","options":["Держать указательный палец вдоль спусковой скобы, переставляя его на спусковой крючок только перед выстрелом","Держать указательный палец всегда на спусковом крючке","Удерживая оружие двумя руками, всегда держать указательные пальцы (один на другом) на спусковом крючке"],"answer":0},{"id":100,"section":"Огневая подготовка","q":"Безопасное использование оружия предполагает в период непосредственного применения:","options":["Ни при каких обстоятельствах не ставить оружие на предохранитель","Не ставить оружие на предохранитель после досылания патрона в патронник, даже если оружие не применяется сразу после досылания патрона","Ставить оружие на предохранитель после досылания патрона в патронник, если оружие не применяется сразу после досылания патрона"],"answer":2},{"id":101,"section":"Огневая подготовка","q":"Безопасное использование оружия предполагает в период непосредственного применения:","options":["При досылании патрона в патронник не отвлекаться на контроль направления ствола оружия","Осуществлять обязательный контроль направления ствола оружия при досылании патрона в патронник для исключения возможного вреда самому владельцу оружия, посторонним лицам и имуществу","Осуществлять контроль направления ствола оружия при досылании патрона в патронник только в ситуациях близости несовершеннолетних или ценного имущества"],"answer":1},{"id":102,"section":"Огневая подготовка","q":"Безопасное использование оружия предполагает в период непосредственного применения:","options":["Не отвлекаться на расчет траектории выстрела (в части исключения вреда посторонним лицам и/или вреда их имуществу)","Обеспечивать траекторию выстрела, исключающую причинение вреда посторонним лицам, а по возможности и их имуществу","Рассчитывать траекторию выстрела только в местах массового скопления людей"],"answer":1},{"id":103,"section":"Огневая подготовка","q":"Безопасное использование оружия при его ношении предполагает передачу оружия лицу, уполномоченному на его проверку:","options":["С патроном в патроннике и присоединенным магазином","С отсоединенным магазином и после проверки факта отсутствия патрона в патроннике","В том состоянии, которого потребовал проверяющий"],"answer":1},{"id":104,"section":"Огневая подготовка","q":"При стрельбе в тире в противошумовых наушниках или защитных очках действуют следующие правила:","options":["Следует закрепить их во избежание падения во время стрельбы","Запрещается надевать, поправлять и снимать их с оружием в руках","Разрешается надевать, поправлять и снимать их с оружием в руках"],"answer":1},{"id":105,"section":"Огневая подготовка","q":"Во время перемещения по тиру или стрельбищу (осмотр мишеней и т.п.) в соответствии с мерами по обеспечению безопасности:","options":["Оружие должно находиться в руках стрелка","Оружие должно находиться в кобуре стрелка или на столике стрелка в разряженном и поставленном на предохранитель виде","Оружие по усмотрению стрелка либо находится в руках стрелка, либо помещается в кобуру стрелка"],"answer":1},{"id":106,"section":"Огневая подготовка","q":"Неполная разборка пистолета (для пистолетов, по конструкции сходных с пистолетом Макарова) производится в следующем порядке:","options":["Отделить затвор, отвинтить винт рукоятки, отделить рукоятку от рамки, снять возвратную пружину","Выключить предохранитель (если таковой имеется), отвести спусковую скобу вниз и влево, отделить затвор от рамки, поставить спусковую скобу на место, снять со ствола возвратную пружину","Извлечь магазин из основания рукоятки, выключить предохранитель (если таковой имеется), убедиться в отсутствии патрона в патроннике, отвести спусковую скобу вниз и влево, отделить затвор от рамки, поставить спусковую скобу на место, снять со ствола возвратную пружину"],"answer":2},{"id":107,"section":"Огневая подготовка","q":"Отдачей оружия называется:","options":["Подбрасывание ствола оружия в вертикальной плоскости при выстреле","Движение ствола и связанных с ним деталей оружия в сторону, противоположную движению снаряда (пули) во время выстрела","Передача разряженного и поставленного на предохранитель оружия инструктору (руководителю стрельбы) по окончании стрельб"],"answer":1},{"id":108,"section":"Огневая подготовка","q":"Согласно рекомендациям предприятий-производителей после стрельбы из пистолетов (револьверов) газовыми патронами их чистка производится:","options":["Сухой тканью","Тканью, смоченной спиртом или спиртовым раствором","Тканью, смоченной ружейной смазкой"],"answer":1},{"id":109,"section":"Огневая подготовка","q":"Смазку оружия положено производить:","options":["Одновременно с чисткой","По истечении 10 минут после чистки","Немедленно после чистки"],"answer":2},{"id":110,"section":"Огневая подготовка","q":"Для эффективного поражения цели предполагается ведение огня (в зависимости от дистанции):","options":["На дистанции, не превышающей рекомендуемую для данного оружия","На любой дистанции (в том числе и превышающей рекомендуемую для данного оружия)","На дистанции, не превышающей максимальную дальность полета пули из данного оружия"],"answer":0},{"id":111,"section":"Огневая подготовка","q":"Меры безопасности при проведении на стрелковых объектах специальных упражнений (связанных с поворотами, разворотами, кувырками, перекатами и т.п.) предполагают:","options":["Обязательное применение оружия, предназначенного для подразделений специального назначения","Нахождение оружия на предохранителе вплоть до момента открытия огня, направление оружия и производство выстрелов только по мишеням, установленным перед пулеприемником (пулеприемниками)","Надежное удержание оружия при передвижениях, без каких-либо дополнительных требований"],"answer":1},{"id":112,"section":"Огневая подготовка","q":"Для временного прекращения стрельбы в тире (на стрельбище) подается команда:","options":["«Оружие к осмотру»","«Разряжай»","«Стой»"],"answer":2},{"id":113,"section":"Огневая подготовка","q":"Действия по временному прекращению стрельбы в тире (на стрельбище) или в ходе применения оружия гражданином в ситуациях необходимой обороны или крайней необходимости:","options":["Прекратить нажим на хвост спускового крючка; извлечь магазин (для оружия, имеющего магазин), произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела), включить предохранитель (если таковой имеется)","Прекратить нажим на хвост спускового крючка; включить предохранитель (если таковой имеется); при необходимости – перезарядить оружие","Прекратить нажим на хвост спускового крючка; извлечь магазин (для оружия, имеющего магазин), произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела)"],"answer":1},{"id":114,"section":"Огневая подготовка","q":"В случае неполного израсходования патронов в тире (на стрельбище) подается команда:","options":["«Оружие к осмотру»","«Разряжай»","«Стой»"],"answer":1},{"id":115,"section":"Огневая подготовка","q":"Действия при завершении стрельбы в тире (на стрельбище):","options":["Прекратить нажим на хвост спускового крючка, включить предохранитель (если таковой имеется), в случае неполного израсходования патронов по команде «Разряжай» разрядить оружие (согласно правилам, установленным для данного оружия), далее произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела)","Прекратить нажим на хвост спускового крючка; включить предохранитель (если таковой имеется)","Прекратить нажим на хвост спускового крючка, включить предохранитель (если таковой имеется), в случае неполного израсходования патронов по команде «Разряжай» разрядить оружие (согласно правилам, установленным для данного оружия); далее действовать по командам «Оружие – к осмотру» и «Отбой»"],"answer":2},{"id":116,"section":"Огневая подготовка","q":"Действия с пистолетом при получении в тире (на стрельбище) команды «Оружие – к осмотру»:","options":["Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») поставить оружие на предохранитель; магазин вставить в основание рукоятки, и в зависимости от доведенных условий стрельбы - вложить пистолет в кобуру или поместить его на стойку (столик) стрелка","Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») снять с затворной задержки, произвести контрольный спуск курка, поставить оружие на предохранитель; магазин вставить в основание рукоятки, и в зависимости от доведенных условий стрельбы - вложить пистолет в кобуру или поместить его на стойку (столик) стрелка","Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») снять с затворной задержки, произвести контрольный спуск курка, поставить оружие на предохранитель"],"answer":1},{"id":117,"section":"Огневая подготовка","q":"Команда «Отбой» подается в тире (на стрельбище):","options":["Перед началом осмотра оружия стреляющих","После завершения осмотра оружия у всей смены стреляющих","После завершения осмотра оружия каждого отдельного стрелка в смене"],"answer":1},{"id":118,"section":"Огневая подготовка","q":"По команде «Отбой», подаваемой в тире (на стрельбище):","options":["Все действия с оружием прекращаются","Не допускаются никакие действия с оружием, кроме действий по его разряжанию","Не допускаются никакие действия с оружием, кроме действий по его осмотру"],"answer":0},{"id":119,"section":"Огневая подготовка","q":"Действия с оружием по завершении его применения гражданином в ситуациях необходимой обороны или крайней необходимости (до прибытия правоохранительных органов):","options":["Прекратить нажим на хвост спускового крючка, и не ставя оружие на предохранитель, дождаться указаний представителей правоохранительных органов","Прекратить нажим на хвост спускового крючка, разрядить оружие, включить предохранитель (если таковой имеется), убрать оружие в кобуру (для тех видов оружия, ношение которых осуществляется в кобуре)","Прекратить нажим на хвост спускового крючка; не разряжая оружие, включить предохранитель (если таковой имеется), убрать оружие в кобуру (для тех видов оружия, ношение которых осуществляется в кобуре)"],"answer":2},{"id":120,"section":"Огневая подготовка","q":"Тактика действий вооруженного обороняющегося при агрессивном поведении большой группы людей предполагает:","options":["Применять оружие сразу, не пытаясь покинуть место конфликта или нейтрализовать конфликт","Покинуть место конфликта, при невозможности этого попытаться нейтрализовать агрессию путем переговоров; принимать решение на применение оружие только с учетом целесообразности его применения","В указанной ситуации не применять оружие ни при каких обстоятельствах"],"answer":1},{"id":121,"section":"Огневая подготовка","q":"Тактика действий при наличии на траектории стрельбы третьих лиц, не участвующих в нападении:","options":["Обороняющийся, сам оставаясь в неподвижности, ожидает изменения ситуации (подавая третьим лицам соответствующие команды голосом)","Обороняющийся перемещается в направлении (влево, вправо, вниз или вверх), обеспечивающем безопасную для третьих лиц траекторию выстрела","Обороняющийся не отвлекается на действия, направленные на обеспечение безопасности третьих лиц"],"answer":1},{"id":122,"section":"Огневая подготовка","q":"Что применяется в качестве дополнительной меры по обеспечению сохранности огнестрельного короткоствольного оружия при его ношении:","options":["Использование пистолетного (револьверного) шнура (ремешка)","Обматывание оружия изоляционной лентой","Ношение патронов отдельно от оружия"],"answer":0},{"id":123,"section":"Огневая подготовка","q":"Если при осмотре гильз на них обнаружены дефекты (микротрещина, незначительное вздутие гильзы), как Вы поступите с гильзой?","options":["Утилизирую (выкину)","Если небольшая трещина буду использовать для дальнейшей сборки патрона","Постараюсь заделать трещину или обжать гильзу"],"answer":0},{"id":124,"section":"Огневая подготовка","q":"На что может повлиять чрезмерный заряд пороха в патроне?","options":["На увеличение дальности стрельбы","На кучность попаданий при стрельбе","На приведение в негодность оружия (разрыв ствола и его частей)"],"answer":2},{"id":125,"section":"Огневая подготовка","q":"На что может повлиять некорректная (слабая) посадка капсюля в гильзе?","options":["Разрыв патрона","Осечка при выстреле","Блокировка затвора оружия"],"answer":2},{"id":126,"section":"Огневая подготовка","q":"На что может повлиять чрезмерная посадка капсюля в гильзе?","options":["Преждевременная инициация капсюля","Осечка при выстреле","Разрыв ствола и других частей оружия"],"answer":1},{"id":127,"section":"Огневая подготовка","q":"На что влияют необрезанные гильзы для огнестрельного оружия с нарезным стволом?","options":["Затяжной выстрел","Осечка при выстреле","Точность выстрела"],"answer":2},{"id":128,"section":"Огневая подготовка","q":"Возможно ли при осуществлении посадки капсюля в гильзу наносить по капсюлю удары какими-либо предметами?","options":["Да, возможно","Недопустимо и опасно","Возможно через мягкую ткань или прокладку"],"answer":1},{"id":129,"section":"Огневая подготовка","q":"Влияет ли на точность (кучность) стрельбы обрезка пуль горлышком гильзы?","options":["Не влияет","Влияет","Обрезка вообще не предусмотрена"],"answer":1},{"id":130,"section":"Огневая подготовка","q":"К чему может привести чрезмерная обжимка среза горлышка гильзы (на огнестрельном полуавтоматическом оружии)?","options":["Ни к чему не приведет","Патрон не войдет в патронник","Пуля не вылетит из гильзы"],"answer":1},{"id":131,"section":"Огневая подготовка","q":"К чему приведет недостаточная обжимка среза горлышка гильзы?","options":[" жен быть переведен?","options":["В положении на спине","В устойчивое боковое положение","В положении полусидя"],"answer":2},{"id":142,"section":"Первая помощь","q":"Что надо делать в случае, если у пострадавшего развился приступ эпилепсии (судорожный приступ)?","options":["Удерживать пострадавшего за руки и ноги, для предотвращения укуса языка и его западения ввести в рот ложку, по окончанию приступа перевести в устойчивое боковое положение","Придерживать пострадавшего за голову, не давая ее разбить, по окончанию приступа очистить рот, перевести в устойчивое боковое положение","Придерживать пострадавшего за голову, для предотвращения укуса языка и его западения ввести в рот ложку, по окончанию приступа перевести в устойчивое боковое положение"],"answer":2},{"id":143,"section":"Первая помощь","q":"Какие действия производятся при переложении пострадавшего с переломом позвоночника на щит?","options":["Повернуть пострадавшего на бок, придерживая за плечи и положить его на щит","Положить щит в ноги и, толкая в плечи, поместить пострадавшего на щит","Переложить пострадавшего при помощи «Нидерландского» моста"],"answer":2},{"id":144,"section":"Первая помощь","q":"Правильная транспортировка пострадавшего, находящегося без сознания (за исключением случаев, когда в связи с подозрением на травму позвоночника менять положение тела не рекомендуется) производится:","options":["В положении на спине","В положении на боку","В положении с приподнятыми нижними конечностями"],"answer":1},{"id":145,"section":"Первая помощь","q":"Способы временной остановки кровотечения:","options":["Частичное сгибание конечности, наложение пластыря, наложение давящей повязки","Пальцевое прижатие, максимальное сгибание конечности, наложение жгута (закрутки), наложение давящей повязки","Придание возвышенного положения конечности, наложение асептической повязки"],"answer":1},{"id":146,"section":"Первая помощь","q":"Техника наложения кровоостанавливающего жгута предусматривает:","options":["Наложение жгута на одежду ниже места кровотечения (с указанием времени наложения в записке)","Наложение жгута на одежду выше места кровотечения (с указанием времени наложения в записке)","Наложение жгута под одежду выше места кровотечения"],"answer":1},{"id":147,"section":"Первая помощь","q":"Время наложения кровоостанавливающего жгута:","options":["Летом – не более чем на 1 час, зимой – не более чем на 30 минут","Летом – не более чем на 30 минут, зимой – не более чем на 1 час","Не более чем на 30 минут, независимо от окружающей температуры"],"answer":0},{"id":148,"section":"Первая помощь","q":"При вынужденном длительном наложении кровоостанавливающий жгут необходимо:","options":["Периодически ослаблять, применяя на это время пальцевое прижатие, затем переносить выше прежнего места наложения","Периодически ослаблять, и затем переносить ниже прежнего места наложения","Периодически ослаблять, применяя на это время пальцевое прижатие, затем накладывать на прежнее место"],"answer":0},{"id":149,"section":"Первая помощь","q":"Какова правильная последовательность действий при остановке артериального кровотечения?","options":["Накладывается жгут (скрутка, ремень), накладывается чистая повязка, указывается время наложения жгута","Проводится пальцевая остановка кровотечения, накладывается жгут (скрутка, ремень), накладывается чистая повязка, указывается время наложения жгута","Проводится пальцевая остановка кровотечения, накладывается чистая повязка, накладывается жгут (скрутка, ремень), указывается время наложения жгута"],"answer":1},{"id":150,"section":"Первая помощь","q":"Что применяется для обработки кожи вокруг раны при оказании первой помощи?","options":["5 % раствор йода или иные спиртосодержащие растворы","Мазь Вишневского","Раствор перманганата калия («марганцовка»)"],"answer":0},{"id":151,"section":"Первая помощь","q":"В каком объеме проводятся мероприятия при прекращении сердечной деятельности и дыхания у пострадавшего?","options":["Освобождение дыхательных путей, проведение ИВЛ (
