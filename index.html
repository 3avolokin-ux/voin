<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VOIN TEAM</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== ТЕМЫ ===== dark по умолчанию (бренд), light по выбору/системе ===== */
  :root{
    --bg:#0B0C0E; --panel:#15181C; --card:#1B1F25; --card2:#232830; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --ink:#F2F3F4; --mut:rgba(242,243,244,.55); --mut2:rgba(242,243,244,.38);
    --nav:#0d0f12; --avbg:#0e1013;
    --g1:#B8F24A; --g2:#4FC3E8; --g3:#E07FD8; --g4:#E8C84A; --g5:#4FD1A6; --g6:#FF8FA3; --on-g:#10140C;
    --orange:#F08A3C; --red:#F0574A; --green:#8ED94E;
    --shadow:none;
  }
  :root[data-theme="light"]{
    --bg:#F1F3F6; --panel:#FFFFFF; --card:#FFFFFF; --card2:#F1F3F6; --line:rgba(16,20,26,.10); --line2:rgba(16,20,26,.18);
    --ink:#14171B; --mut:rgba(20,23,27,.58); --mut2:rgba(20,23,27,.42);
    --nav:#FFFFFF; --avbg:#EEF1F5;
    --g1:#5E9400; --g2:#1E88AC; --g3:#B23FA8; --g4:#B08900; --g5:#1E9E76; --g6:#C24E68; --on-g:#FFFFFF;
    --orange:#D9730B; --red:#D93A2E; --green:#2E9E52;
    --shadow:0 2px 10px rgba(16,20,30,.07);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F1F3F6; --panel:#FFFFFF; --card:#FFFFFF; --card2:#F1F3F6; --line:rgba(16,20,26,.10); --line2:rgba(16,20,26,.18);
      --ink:#14171B; --mut:rgba(20,23,27,.58); --mut2:rgba(20,23,27,.42);
      --nav:#FFFFFF; --avbg:#EEF1F5;
      --g1:#5E9400; --g2:#1E88AC; --g3:#B23FA8; --g4:#B08900; --g5:#1E9E76; --g6:#C24E68; --on-g:#FFFFFF;
      --orange:#D9730B; --red:#D93A2E; --green:#2E9E52;
      --shadow:0 2px 10px rgba(16,20,30,.07);
    }
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,'DejaVu Sans',sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:440px;margin:0 auto;min-height:100vh;padding-bottom:82px}
  .mono{font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;font-variant-numeric:tabular-nums}
  .hd{padding:22px 20px 4px;display:flex;justify-content:space-between;align-items:flex-start}
  .eyebrow{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:1.5px;color:var(--mut2);text-transform:uppercase;margin-bottom:9px}
  .h1{font:800 29px/1.05 'Manrope';letter-spacing:-.5px}
  .ava{width:42px;height:42px;border-radius:50%;background:#fff;overflow:hidden;flex:0 0 auto}
  .ava img{width:42px;height:42px}
  .wrap{padding:12px 16px 0}
  .gdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  .scard{border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  .scard .glow{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;opacity:.16}
  .grp-line{display:flex;align-items:center;gap:8px;font:700 13px/1 'Manrope';margin-bottom:12px}
  .grp-when{margin-left:auto;font:600 12px/1 'Manrope';color:var(--mut)}
  .stime{font:800 40px/1 'JetBrains Mono',monospace;letter-spacing:-1px}
  .stime .end{font-size:17px;color:var(--mut);font-weight:500}
  .smeta{color:var(--mut);font:500 12.5px/1 'Manrope';margin-top:9px}
  .btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font:700 15px/1 'Manrope';margin-top:12px;cursor:pointer;color:var(--ink);background:var(--card2)}
  .btn.acc{background:var(--g1);color:var(--on-g)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
  .btn.sm{padding:11px;font-size:14px}
  .btn.danger{color:var(--red);background:transparent;border:1px solid var(--line2)}

  .stats{display:flex;gap:9px;margin-bottom:16px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px 10px;box-shadow:var(--shadow)}
  .stat .n{font:800 24px/1 'JetBrains Mono',monospace}
  .stat .l{color:var(--mut);font-size:10.5px;margin-top:5px;font-weight:600}
  .stat.a1 .n{color:var(--g1)}

  h2.sec{font:700 10.5px/1 'JetBrains Mono',monospace;letter-spacing:1.3px;color:var(--mut2);text-transform:uppercase;margin:14px 2px 10px;display:flex;align-items:center;gap:8px}
  h2.sec:first-child{margin-top:2px}
  h2.sec .cnt{background:var(--red);color:#fff;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;font-size:10px;padding:0 4px}

  .att{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
  .att .ic{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .att .tt{font:700 14.5px/1.2 'Manrope'} .att .ss{color:var(--mut);font-size:12px;margin-top:3px}
  .att .arr{margin-left:auto;color:var(--mut2);font-size:20px}
  .ic.o{background:rgba(240,138,60,.16);color:var(--orange)} .ic.r{background:rgba(240,87,74,.16);color:var(--red)} .ic.b{background:rgba(79,195,232,.18);color:var(--g2)} .ic.ok{background:rgba(142,217,78,.18);color:var(--green)}

  .tl{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
  .tl .tm{font:800 15px/1 'JetBrains Mono',monospace}
  .tl .bar{width:3px;height:34px;border-radius:2px}
  .tl .g{font:700 14px/1.1 'Manrope'} .tl .m{color:var(--mut);font-size:11.5px;margin-top:3px}
  .tl .tag{margin-left:auto;font:700 10px/1 'JetBrains Mono',monospace;padding:4px 8px;border-radius:6px;letter-spacing:.5px}

  .gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow)}
  .gcard .top{display:flex;justify-content:space-between;align-items:flex-start}
  .gcard .gn{font:800 19px/1 'Manrope'} .gcard .gl{color:var(--mut);font-size:12.5px;margin-top:5px}
  .gnum{font:800 26px/1 'JetBrains Mono',monospace;text-align:right}
  .gnum .u{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:3px}
  .badges{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .bdg{font:700 10.5px/1 'JetBrains Mono',monospace;padding:5px 9px;border-radius:7px;letter-spacing:.4px;display:flex;align-items:center;gap:5px}
  .bdg.debt{background:rgba(240,138,60,.16);color:var(--orange)}

  .subtabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .subtab{flex:1;text-align:center;font:700 13px/1 'Manrope';padding:9px;border-radius:9px;background:none;border:none;color:var(--mut)}
  .subtab.on{background:var(--card2);color:var(--ink)}

  .search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:12px 14px;font-size:15px;font-family:'Manrope';margin-bottom:12px}
  .search::placeholder{color:var(--mut2)}

  .prow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .12s;box-shadow:var(--shadow)}
  .prow.on{border-color:var(--g1);background:color-mix(in srgb,var(--g1) 8%,var(--card))}
  .av{width:38px;height:38px;border-radius:50%;background:var(--avbg);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:700 13px/1 'Manrope';flex:0 0 auto}
  .prow .nm{font:600 15px/1.15 'Manrope';min-width:0}
  .prow .sb{color:var(--mut);font-size:11.5px;margin-top:2px}
  .prow .chk{margin-left:auto;width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;border:2px solid var(--line2);color:var(--mut2)}
  .prow.on .chk{background:var(--g1);border-color:var(--g1);color:var(--on-g)}
  .prow .st{margin-left:8px;font:700 10px/1 'JetBrains Mono',monospace;padding:4px 7px;border-radius:6px;flex:0 0 auto}
  .st.sick{background:rgba(79,195,232,.18);color:var(--g2)} .st.injury{background:rgba(224,127,216,.18);color:var(--g3)} .st.absent{background:rgba(240,87,74,.16);color:var(--red)}
  .st.debt{background:rgba(240,138,60,.16);color:var(--orange)} .st.paid{background:rgba(142,217,78,.18);color:var(--green)}
  .dots{margin-left:6px;color:var(--mut2);font-size:20px;padding:0 4px;flex:0 0 auto}
  .paybtn{margin-left:auto;flex:0 0 auto;border:none;background:var(--g1);color:var(--on-g);font:700 13px/1 'Manrope';padding:9px 15px;border-radius:10px}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);font:700 12.5px/1 'Manrope';padding:8px 13px;border-radius:20px;display:flex;align-items:center;gap:6px}
  .chip.on{background:var(--card2);color:var(--ink);border-color:var(--line2)}
  .arr{margin-left:auto;color:var(--mut2);font-size:20px;flex:0 0 auto}

  .rhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .rback{background:var(--panel);border:1px solid var(--line);border-radius:11px;width:40px;height:40px;font-size:18px;color:var(--ink);flex:0 0 auto}
  .rtitle .rt{font:800 18px/1 'Manrope'} .rtitle .rs{color:var(--mut);font-size:12px;margin-top:3px}
  .rdate{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:13px;margin-bottom:12px;font-family:'Manrope'}

  .savebar{position:fixed;left:0;right:0;bottom:64px;max-width:440px;margin:0 auto;padding:10px 16px;background:linear-gradient(transparent,var(--bg) 45%)}

  /* карточка ученика */
  .cardtop{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .cardav{width:58px;height:58px;border-radius:50%;background:var(--avbg);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font:800 20px/1 'Manrope';flex:0 0 auto}
  .cardname{font:800 21px/1.1 'Manrope'} .cardsub{color:var(--mut);font-size:12.5px;margin-top:4px;display:flex;align-items:center;gap:6px}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .kv .k{color:var(--mut);font-size:13px} .kv .v{font-weight:700;font-size:14px}
  .kv a.v{color:var(--g2);text-decoration:none}
  .kv .v.mono{font-family:'JetBrains Mono',monospace}

  .nav{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:30}
  .nav button{flex:1;background:none;border:none;color:var(--mut2);padding:10px 0 12px;font:600 10px/1 'Manrope';display:flex;flex-direction:column;align-items:center;gap:5px}
  .nav button.on{color:var(--g1)}
  .nav .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
  .nav .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:50}
  .modal.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:440px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:88vh;overflow:auto}
  .sheet h3{font:800 18px/1.1 'Manrope';margin-bottom:6px}
  .muted{color:var(--mut);font-size:12.5px;margin:2px 0 14px;line-height:1.5}
  .opt{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;font-weight:600;font-size:15px}
  .opt .d{width:10px;height:10px;border-radius:50%}
  .opt.on{border-color:var(--g1)}
  .field{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px;font-size:15px;margin-bottom:10px;font-family:'Manrope'}
  label.lbl{display:block;color:var(--mut);font-size:11.5px;margin:2px 2px 6px;font-weight:600}
  .link{color:var(--mut);font-size:13px;text-align:center;padding:10px}
  .empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:13.5px}
  .seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
  .seg button{flex:1;border:none;background:none;color:var(--mut);font:700 13px/1 'Manrope';padding:10px;border-radius:9px}
  .seg button.on{background:var(--card2);color:var(--ink)}
  .row2{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .row2 .t{font-weight:600;font-size:15px} .row2 .s{color:var(--mut);font-size:12px;margin-top:2px}
  ::-webkit-scrollbar{width:0;height:0}
  .chips,.subtabs{scrollbar-width:none;-ms-overflow-style:none}
  .ringwrap{position:relative;width:62px;height:62px;margin:0 auto 2px}
  .ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 15px/1 'JetBrains Mono',monospace}
  .cardring{position:relative;width:74px;height:74px;flex:0 0 auto}
  .cardring .ringtxt{font-size:18px}
  .wk{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
  .wk .wd{font:700 12px/1 'JetBrains Mono',monospace;color:var(--mut2);width:36px;flex:0 0 auto;padding-top:4px}
  .wk .cells{display:flex;flex-wrap:wrap;gap:6px}
  .wk .cell{font:700 11.5px/1 'JetBrains Mono',monospace;padding:5px 9px;border-radius:7px;color:var(--on-g)}
  .wk .none{color:var(--mut2);font-size:12px;padding-top:4px}
  .gcard2{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .gcard2 .hd2{display:flex;gap:14px;align-items:center}
  .gcard2 .gtitle{font:800 20px/1 'Manrope'} .gcard2 .gtitle .lv{font-size:12px;font-weight:700;margin-left:7px}
  .gcard2 .gmeta{color:var(--mut);font-size:12px;margin-top:5px}
  .gbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .gb{font:700 10.5px/1 'JetBrains Mono',monospace;padding:5px 9px;border-radius:6px;background:var(--card2);color:var(--mut)}
  .gb.debt{background:rgba(240,138,60,.16);color:var(--orange)} .gb.risk{background:rgba(240,87,74,.16);color:var(--red)}
  .gsq-row{display:flex;gap:4px;margin-top:13px}
  .gsq{flex:1;height:22px;border-radius:3px;background:var(--card2)}
  .gsq.empty{opacity:.45}
  .gsq-cap{color:var(--mut2);font:700 9.5px/1 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-top:7px}
  .agday{display:flex;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .agday.today .dnum{color:var(--g1)}
  .agdate{width:44px;flex:0 0 auto;text-align:center}
  .agdate .dnum{font:800 22px/1 'JetBrains Mono',monospace}
  .agdate .dwd{color:var(--mut2);font:700 10px/1 'JetBrains Mono',monospace;margin-top:4px;text-transform:uppercase}
  .agsess{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .agrow{display:flex;align-items:center;gap:11px}
  .agrow .at{font:800 14px/1 'JetBrains Mono',monospace;width:44px;flex:0 0 auto}
  .agrow .abar{width:3px;height:32px;border-radius:2px;flex:0 0 auto}
  .agrow .an{font:700 13.5px/1.2 'Manrope'} .agrow .al{color:var(--mut);font-size:11px;margin-top:2px}
  .agrow .ac{margin-left:auto;color:var(--mut2);font:700 11px/1 'JetBrains Mono',monospace;flex:0 0 auto}
  .agrest{color:var(--mut2);font-size:13px;padding-top:5px;letter-spacing:1px}
  [data-skin="garmin"] .gcard2{border-radius:3px}
  [data-skin="garmin"] .gtitle,[data-skin="garmin"] .agrow .an{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.3px}
  [data-skin="garmin"] .ringtxt{font-family:'Oswald',sans-serif}

  /* ===== СКИН «ГАРМИН» (стиль приборной панели) ===== */
  :root[data-skin="garmin"]{
    --bg:#0B0D0E; --panel:#16191B; --card:#101214; --card2:#1B1E20; --line:#262B2F; --line2:#3A4147;
    --ink:#F4F6F7; --mut:#9AA5B1; --mut2:#7C8894; --nav:#0B0D0E; --avbg:#16191B;
    --g1:#00A9E1; --g2:#9B7BFF; --g3:#FF4F9A; --g4:#FFB300; --g5:#33D6C0; --g6:#FF7AB0; --on-g:#001016;
    --orange:#FFB300; --red:#E5322D; --green:#78BE20; --shadow:none;
  }
  [data-skin="garmin"] body{font-family:'Roboto Condensed','Oswald',system-ui,sans-serif}
  [data-skin="garmin"] .h1,[data-skin="garmin"] .cardname{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  [data-skin="garmin"] .stime,[data-skin="garmin"] .gnum,[data-skin="garmin"] .stat .n,[data-skin="garmin"] .h1{font-family:'Oswald',sans-serif}
  [data-skin="garmin"] .scard,[data-skin="garmin"] .att,[data-skin="garmin"] .tl,[data-skin="garmin"] .gcard,[data-skin="garmin"] .prow,[data-skin="garmin"] .row2,[data-skin="garmin"] .kv,[data-skin="garmin"] .search,[data-skin="garmin"] .seg,[data-skin="garmin"] .subtabs,[data-skin="garmin"] .chip,[data-skin="garmin"] .btn,[data-skin="garmin"] .paybtn,[data-skin="garmin"] .rback,[data-skin="garmin"] .cardav,[data-skin="garmin"] .av,[data-skin="garmin"] .opt,[data-skin="garmin"] .field{border-radius:3px}
  [data-skin="garmin"] .btn.acc,[data-skin="garmin"] .paybtn,[data-skin="garmin"] .subtab.on,[data-skin="garmin"] .chip{text-transform:uppercase;letter-spacing:.6px;font-family:'Roboto Condensed',sans-serif;font-weight:700}
  [data-skin="garmin"] .scard .glow{display:none}
  [data-skin="garmin"] .stats{gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  [data-skin="garmin"] .stat{border:none;border-right:1px solid var(--line);border-radius:0;background:transparent}
  [data-skin="garmin"] .stats .stat:last-child{border-right:none}
  [data-skin="garmin"] h2.sec{border-bottom:1px solid var(--line);padding-bottom:9px;margin-top:18px}
  [data-skin="garmin"] .nav button{text-transform:uppercase;letter-spacing:.5px}
  [data-skin="garmin"] .grp-line span,[data-skin="garmin"] .smeta,[data-skin="garmin"] .tl .m,[data-skin="garmin"] .att .ss{text-transform:uppercase;letter-spacing:.4px}
  [data-skin="garmin"] .tl .bar{width:4px}
</style>

<script>
"use strict";
function gidx(gid){for(var i=0;i<state.groups.length;i++){if(state.groups[i].id===gid)return i;}return 0;}
function gvar(gid){return '--g'+((gidx(gid)%6)+1);}
function gcol(gid){return getComputedStyle(document.documentElement).getPropertyValue(gvar(gid)).trim()||'#888';}
function pad(n){return String(n).padStart(2,'0');}
function mk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nextMonthKey(m){var y=+m.slice(0,4),mo=+m.slice(5);mo++;if(mo>12){mo=1;y++;}return y+'-'+pad(mo);}
var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var WDF=['ВОСКРЕСЕНЬЕ','ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА','СУББОТА'];
var MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MNF=['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

/* ---- логика ---- */
function SPM(){return state.settings.sessionsPerMonth;}
function balanceOf(s){var p=(s.payments||[]).length*SPM(),sp=0,a=s.attendance||{};for(var d in a){if(a[d]==='present'||a[d]==='absent')sp++;}return p-sp;}
function paidThrough(s){var p=s.payments||[];return p.length?p.slice().sort().pop():null;}
function isDebtor(s,t){if(s.type!=='monthly')return false;var c=mk(t),pt=paidThrough(s);if(pt&&pt>=c)return false;return t.getDate()>state.settings.payDay;}
function medOk(s,t){if(!s.med||!s.med.until)return false;return s.med.until>=dstr(t);}
function marksSorted(s){var a=s.attendance||{};return Object.keys(a).sort().map(function(d){return a[d];});}
function missedStreak(s){var m=marksSorted(s),c=0;for(var i=m.length-1;i>=0;i--){if(m[i]==='absent')c++;else break;}return c;}
function rate(list){var pr=0,tot=0;list.forEach(function(s){var a=s.attendance||{};for(var d in a){if(a[d]==='present'){pr++;tot++;}else if(a[d]==='absent')tot++;}});return tot?Math.round(pr/tot*100):0;}
function sessionsDue(s){return state.settings.carryMode==='accumulate'?SPM():Math.max(0,SPM()-balanceOf(s));}
function lastPresent(s){var a=s.attendance||{},d=Object.keys(a).filter(function(x){return a[x]==='present';}).sort();return d.length?d[d.length-1]:null;}
function isMissing(s,t){var lp=lastPresent(s);if(!lp)return (s.payments&&s.payments.length)>0;return Math.floor((t-new Date(lp+'T00:00:00'))/86400000)>14;}

/* ---- хранилище ---- */
var KEY='voin_v3', state=null;
function load(){try{var r=localStorage.getItem(KEY);if(r){state=JSON.parse(r);return;}}catch(e){}state=seed();save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function seed(){

function applyTheme(){var t=state.settings.theme,r=document.documentElement;if(t==='light')r.setAttribute('data-theme','light');else if(t==='dark')r.setAttribute('data-theme','dark');else r.removeAttribute('data-theme');

/* ---- сессии ---- */
function allTodaySessions(now){var wd=now.getDay(),res=[];state.groups.forEach(function(g){g.sessions.forEach(function(se){if(se.wd===wd){var st=new Date(now);st.setHours(+se.time.slice(0,2),+se.time.slice(3),0,0);res.push({g:g,se:se,start:st});}});});res.sort(function(a,b){return a.start-b.start;});return res;}
function nextSession(now){var best=null;for(var off=0;off<14;off++){var day=new Date(now);day.setDate(day.getDate()+off);var wd=day.getDay();state.groups.forEach(function(g){g.sessions.forEach(function(se){if(se.wd!==wd)return;var st=new Date(day);st.setHours(+se.time.slice(0,2),+se.time.slice(3),0,0);var en=new Date(st.getTime()+se.dur*60000);if(en<now)return;if(!best||st<best.start)best={g:g,se:se,start:st,end:en,off:off};});});if(best&&off>=1)break;}return best;}

/* ---- утилиты ---- */
function ini(n){var p=n.trim().split(/\s+/);return((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(h){var t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;}
function inGroup(id){return state.students.filter(function(s){return s.group===id;});}
function grp(id){return state.groups.filter(function(g){return g.id===id;})[0];}
function relTime(now,st){var mins=Math.round((st-now)/60000);if(mins<0)return 'идет';if(mins<60)return 'через '+mins+' мин';var h=Math.floor(mins/60),mm=mins%60;return 'через '+h+' ч'+(mm?' '+mm+' мин':'');}
function ringSVG(pct,color,size,stroke){size=size||62;stroke=stroke||7;pct=Math.max(0,Math.min(100,pct));var r=(size-stroke)/2,cx=size/2,c=2*Math.PI*r,off=c*(1-pct/100);return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><g transform="rotate(-90 '+cx+' '+cx+')"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--line2)" stroke-width="'+stroke+'"/><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" stroke-linecap="round"/></g></svg>';}
function humanD(ds){var d=new Date(ds+'T00:00:00');return d.getDate()+' '+MN[d.getMonth()];}
function endTime(se){var t=+se.time.slice(0,2)*60+ +se.time.slice(3)+se.dur;return pad(Math.floor(t/60)%24)+':'+pad(t%60);}

var tab='today', roster=null, card=null, groupView=null, payView=false;

/* Оплаты */
function dueMonthKey(s){var pt=paidThrough(s);return pt?nextMonthKey(pt):mk(new Date());}
function payNow(s){if(!s.payments)s.payments=[];s.payments.push(dueMonthKey(s));save();render();}

  if(payView){var bh=el('<div class="rhead"><button class="rback">‹</button><div class="rtitle"><div class="rs">Назад к группам</div></div></div>');bh.querySelector('.rback').onclick=function(){payView=false;render();};v.appendChild(bh);}
  var now=new Date(),cur=mk(now),monthly=state.students.filter(function(s){return s.type==='monthly';});
  var deb=monthly.filter(function(s){return isDebtor(s,now);}),paid=monthly.filter(function(s){return !isDebtor(s,now);}),sing=state.students.filter(function(s){return s.type==='single';});

  v.appendChild(el('<div class="stats"><div class="stat"><div class="n mono" style="color:var(--green)">'+paid.length+'</div><div class="l">оплатили</div></div><div class="stat"><div class="n mono" style="color:var(--orange)">'+deb.length+'</div><div class="l">ждут оплату</div></div><div class="stat"><div class="n mono">'+MNF[+cur.slice(5)].slice(0,3)+'</div><div class="l">текущий месяц</div></div></div>'));

  var a=el('<button class="btn ghost" style="margin-top:0;width:auto;flex:0 0 auto;padding:0 18px;font-size:20px">+</button>');a.onclick=function(){personSheet(null);};
  w.appendChild(i);w.appendChild(a);v.appendChild(w);

    } else {
      state.groups.forEach(function(g){results.appendChild(groupCard(g));});
    }

function groupCard(g){
  var list=inGroup(g.id),c=gcol(g.id),now=new Date();
  var deb=list.filter(function(s){return isDebtor(s,now);}).length,risk=list.filter(function(s){return missedStreak(s)>=3;}).length,rt=rate(list);
  var age=(g.level.split(' · ')[1]||'').toUpperCase();
  var days=[];g.sessions.forEach(function(se){var w=WD[se.wd];if(days.indexOf(w)<0)days.push(w);});
  var times=[];g.sessions.forEach(function(se){if(times.indexOf(se.time)<0)times.push(se.time);});
  var metaLine=(age?age+' · ':'')+days.join(' · ')+(times.length?' · '+times.join(' / '):'');
  var badges='<span class="gb">'+list.length+' чел</span>'+(deb?'<span class="gb debt">₽ '+deb+'</span>':'')+(risk?'<span class="gb risk">риск '+risk+'</span>':'');
  var card=el('<div class="gcard2"><div class="hd2">'+
    '<div class="cardring" style="width:64px;height:64px">'+ringSVG(rt,c,64,7)+'<span class="ringtxt mono" style="font-size:14px">'+rt+'%</span></div>'+
    '<div style="flex:1;min-width:0"><div class="gtitle">'+esc(g.name)+'<span class="lv" style="color:'+c+'">'+esc(g.level.split(' · ')[0])+'</span></div><div class="gmeta">'+esc(metaLine)+'</div><div class="gbadges">'+badges+'</div></div></div>'+
    attnGraph(list,c)+'</div>');
  card.onclick=function(){openRoster(g.id,dstr(new Date()));};return card;
}
function attnGraph(list,color){
  var dates={};list.forEach(function(s){for(var d in (s.attendance||{}))dates[d]=1;});
  var keys=Object.keys(dates).sort(),last=keys.slice(-14),cells=[];
  for(var i=0;i<14-last.length;i++)cells.push('<span class="gsq empty"></span>');
  last.forEach(function(d){var pr=0,t=0;list.forEach(function(s){var v=(s.attendance||{})[d];if(v==='present'){pr++;t++;}else if(v==='absent'||v==='sick'||v==='injury')t++;});var ratio=t?pr/t:0;cells.push('<span class="gsq" style="background:'+color+';opacity:'+(0.22+0.78*ratio).toFixed(2)+'"></span>');});
  return '<div class="gsq-row">'+cells.join('')+'</div><div class="gsq-cap">последние 14 занятий · насыщенность = явка</div>';
}

/* Расписание (лента по датам) */
function renderSchedule(v){
  var now=new Date(),today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(var off=0;off<14;off++){(function(off){
    var day=new Date(today0);day.setDate(day.getDate()+off);var wd=day.getDay();
    var sess=[];state.groups.forEach(function(g){g.sessions.forEach(function(se){if(se.wd===wd)sess.push({g:g,se:se});});});
    sess.sort(function(a,b){return a.se.time<b.se.time?-1:1;});
    var rows=sess.length?sess.map(function(x){var c=gcol(x.g.id),cnt=inGroup(x.g.id).length;return '<div class="agrow" data-i="'+sess.indexOf(x)+'"><span class="at mono">'+x.se.time+'</span><span class="abar" style="background:'+c+'"></span><div style="min-width:0"><div class="an">'+esc(x.g.name)+' · '+esc(x.g.level.split(" · ")[0])+'</div><div class="al">'+x.se.dur+' мин</div></div><span class="ac">'+cnt+' чел</span></div>';}).join(''):'<div class="agrest">Отдых</div>';
    var row=el('<div class="agday'+(off===0?' today':'')+'"><div class="agdate"><div class="dnum mono">'+day.getDate()+'</div><div class="dwd">'+WD[wd]+'</div></div><div class="agsess">'+rows+'</div></div>');
    row.querySelectorAll('.agrow').forEach(function(ar){ar.onclick=function(){openRoster(sess[+ar.getAttribute('data-i')].g.id,dstr(day));};});
    v.appendChild(row);
  })(off);}
}

/* Карточка ученика */
function openCard(id){card=id;roster=null;render();}
function renderCard(v){
  var s=state.students.filter(function(x){return x.id===card;})[0];if(!s){card=null;render();return;}
  var now=new Date(),g=grp(s.group),c=gcol(s.group),pt=paidThrough(s),bal=balanceOf(s),deb=isDebtor(s,now);
  v.appendChild((function(){var h=el('<div class="rhead"><button class="rback">‹</button><div class="rtitle"><div class="rs">Назад к списку</div></div></div>');h.querySelector('.rback').onclick=function(){card=null;render();};return h;})());
  var srt=rate([s]);
  v.appendChild(el('<div class="cardtop"><div class="cardav">'+esc(ini(s.name))+'</div><div style="flex:1;min-width:0"><div class="cardname">'+esc(s.name)+'</div><div class="cardsub"><span class="gdot" style="background:'+c+'"></span>'+esc(g.name)+' · '+esc(g.level)+'</div></div><div class="cardring">'+ringSVG(srt,c,74,8)+'<span class="ringtxt mono">'+srt+'%</span></div></div>'));
  function kv(k,val,cls){return '<div class="kv"><span class="k">'+k+'</span><span class="v '+(cls||'')+'">'+val+'</span></div>';}
  var html='';
  html+=kv('Тип оплаты', s.type==='single'?'Разовая':'Абонемент 12 занятий');
  if(s.type==='monthly'){html+=kv('Остаток занятий', bal, 'mono');html+=kv('Оплата', deb?'<span style="color:var(--orange)">долг · к оплате '+sessionsDue(s)+'</span>':(pt?'оплачен по '+MNF[+pt.slice(5)]:'нет'));}
  else {var cnt=Object.keys(s.attendance||{}).filter(function(d){return s.attendance[d]==='present';}).length;html+=kv('Оплачено занятий', cnt,'mono');}
  html+=kv('Посещаемость', rate([s])+'%','mono');
  var lp=lastPresent(s);html+=kv('Последнее посещение', lp?humanD(lp):'нет данных');
  html+=kv('Телефон ученика', s.phone?'<a class="v" href="tel:'+esc(s.phone.replace(/\s/g,''))+'">'+esc(s.phone)+'</a>':'<span style="color:var(--mut2)">нет</span>');
  html+=kv('Телефон родителя', s.parentPhone?'<a class="v" href="tel:'+esc(s.parentPhone.replace(/\s/g,''))+'">'+esc(s.parentPhone)+'</a>':'<span style="color:var(--mut2)">нет</span>');
  v.insertAdjacentHTML('beforeend',html);
  var b1=el('<button class="btn acc" style="background:'+c+'">Отметить оплату</button>');b1.onclick=function(){paySheet(s);};v.appendChild(b1);
  var b2=el('<button class="btn ghost">Изменить данные</button>');b2.onclick=function(){personSheet(s);};v.appendChild(b2);
}

/* Ростер (любая дата) */
function openRoster(gid,date){roster={gid:gid,date:date};card=null;render();}
function renderRoster(v){
  var g=grp(roster.gid),c=gcol(g.id),now=new Date();
  v.appendChild((function(){var h=el('<div class="rhead"><button class="rback">‹</button><div class="rtitle"><div class="rt">'+esc(g.name)+' · '+esc(g.level.split(" · ")[0])+'</div><div class="rs">тапни пришедших, справку и травму через ⋯</div></div></div>');h.querySelector('.rback').onclick=function(){roster=null;render();};return h;})());
  v.appendChild((function(){var wrap=el('<div style="display:flex;gap:9px;margin-bottom:12px"></div>');var d=el('<input type="date" class="rdate" style="margin:0" value="'+roster.date+'">');d.onchange=function(){roster.date=d.value;render();};var a=el('<button class="btn ghost" style="margin-top:0;width:auto;flex:0 0 auto;padding:0 16px">+ Ученик</button>');a.onclick=function(){personSheet(null,g.id);};wrap.appendChild(d);wrap.appendChild(a);return wrap;})());
  var list=inGroup(g.id);
  if(!list.length)v.appendChild(el('<div class="empty">В группе пока нет учеников. Добавь через «+ Ученик».</div>'));
  list.forEach(function(s){var mkd=(s.attendance&&s.attendance[roster.date])||'',on=mkd==='present';
    var sub=s.type==='single'?'разовый':('остаток '+balanceOf(s)+' зан.');
    var stTag=mkd==='sick'?'<span class="st sick">СПРАВКА</span>':mkd==='injury'?'<span class="st injury">ТРАВМА</span>':mkd==='absent'?'<span class="st absent">НЕ БЫЛ</span>':'';
    var row=el('<div class="prow '+(on?'on':'')+'"><div class="av">'+esc(ini(s.name))+'</div><div style="min-width:0"><div class="nm">'+esc(s.name)+'</div><div class="sb">'+sub+'</div></div>'+stTag+'<div class="chk">'+(on?'✓':'')+'</div><div class="dots">⋯</div></div>');
    row.onclick=function(e){if(e.target.closest('.dots')){statusSheet(s);return;}if(!s.attendance)s.attendance={};if(s.attendance[roster.date]==='present')delete s.attendance[roster.date];else s.attendance[roster.date]='present';save();render();};
    v.appendChild(row);});
  var marked=list.filter(function(s){return s.attendance&&s.attendance[roster.date];}).length;
  v.appendChild(el('<div style="height:70px"></div>'));
  var bar=el('<div class="savebar"><button class="btn acc" style="background:'+c+'">Готово · отмечено '+marked+' из '+list.length+'</button></div>');
  bar.querySelector('button').onclick=function(){roster=null;render();};document.body.appendChild(bar);
}

/* Настройки */
function renderSettings(v){
  v.appendChild(el('<h2 class="sec">Вид приложения</h2>'));
  var sk=state.settings.skin||'standard';
  var segs=el('<div class="seg"><button data-sk="standard">Стандартный</button><button data-sk="garmin">Гармин</button></div>');
  segs.querySelectorAll('button').forEach(function(b){if(sk===b.getAttribute('data-sk'))b.classList.add('on');b.onclick=function(){state.settings.skin=b.getAttribute('data-sk');save();applyTheme();render();};});
  v.appendChild(segs);
  v.appendChild(el('<div class="muted" style="margin:0 2px 4px">Стандартный - лаймовый, скругленный. Гармин - стиль приборной панели: черный фон, острые углы, циан.</div>'));

  v.appendChild(el('<h2 class="sec">Тема</h2>'));
  var seg=el('<div class="seg"><button data-th="light">Светлая</button><button data-th="dark">Темная</button><button data-th="system">Как в системе</button></div>');
  seg.querySelectorAll('button').forEach(function(b){if(state.settings.theme===b.getAttribute('data-th'))b.classList.add('on');b.onclick=function(){state.settings.theme=b.getAttribute('data-th');save();applyTheme();render();};});
  v.appendChild(seg);
  if(sk==='garmin')v.appendChild(el('<div class="muted" style="margin:-6px 2px 4px">В режиме Гармин тема всегда темная.</div>'));

  v.appendChild(el('<h2 class="sec">Группы</h2>'));
  state.groups.forEach(function(g){var c=gcol(g.id);var r=el('<div class="row2"><div><div class="t"><span class="gdot" style="display:inline-block;background:'+c+';margin-right:6px"></span>'+esc(g.name)+'</div><div class="s">'+esc(g.level)+' · '+inGroup(g.id).length+' чел</div></div><div class="arr">›</div></div>');r.onclick=function(){groupEditSheet(g);};v.appendChild(r);});
  v.appendChild((function(){var b=el('<button class="btn ghost" style="margin-top:2px">+ Добавить группу</button>');b.onclick=function(){groupEditSheet(null);};return b;})());

  v.appendChild(el('<h2 class="sec">Расписание по группам</h2>'));
  state.groups.forEach(function(g){var c=gcol(g.id);var days=g.sessions.map(function(se){return WD[se.wd]+' '+se.time;}).join(' · ');
    var r=el('<div class="row2"><div><div class="t"><span class="gdot" style="display:inline-block;background:'+c+';margin-right:6px"></span>'+esc(g.name)+'</div><div class="s">'+days+'</div></div><div class="arr">›</div></div>');
    r.onclick=function(){schedSheet(g);};v.appendChild(r);});

  v.appendChild(el('<h2 class="sec">Правила оплаты</h2>'));
  v.appendChild((function(){var r=el('<div class="row2"><div><div class="t">Занятий в абонементе</div><div class="s">списывается за приход и пропуск без справки</div></div><div class="v mono" style="font-weight:800">'+SPM()+'</div></div>');return r;})());
  v.appendChild((function(){var r=el('<div class="row2"><div><div class="t">День оплаты</div><div class="s">после этого числа неоплатившие в должниках</div></div><div class="v mono" style="font-weight:800">'+state.settings.payDay+'</div></div>');r.onclick=function(){rulesSheet();};return r;})());
  v.appendChild((function(){var r=el('<div class="row2"><div><div class="t">Перенос остатка</div><div class="s">'+(state.settings.carryMode==='accumulate'?'платит за 12, сохраненное идет плюсом':'платит меньшей суммой до 12')+'</div></div><div class="arr">›</div></div>');r.onclick=function(){rulesSheet();};return r;})());

  v.appendChild(el('<h2 class="sec">О приложении</h2>'));
  v.appendChild(el('<div class="row2"><div><div class="t">VOIN TEAM · дневник тренера</div><div class="s">данные хранятся на этом устройстве</div></div></div>'));
}

/* ---- модалки ---- */
function openM(){document.getElementById('modal').classList.add('on');}
function closeM(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeM();});

function markSheet(){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<h3>Отметить посещение</h3><div class="muted">Выбери группу, дату поставишь на следующем экране.</div>'+
    state.groups.map(function(g){return '<div class="opt" data-g="'+g.id+'"><span class="d" style="background:var('+gvar(g.id)+')"></span>'+esc(g.name)+' · '+esc(g.level.split(" · ")[0])+'</div>';}).join('')+'<div class="link" id="cl">Закрыть</div>';
  openM();
  sh.querySelectorAll('[data-g]').forEach(function(o){o.onclick=function(){closeM();openRoster(+o.getAttribute('data-g'),dstr(new Date()));};});
  document.getElementById('cl').onclick=closeM;
}
function statusSheet(s){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<h3>'+esc(s.name)+'</h3><div class="muted">Статус на '+humanD(roster.date)+'. «Был» и «Не был» списывают занятие, справка и травма сохраняют.</div>'+
    '<div class="opt" data-k="present"><span class="d" style="background:var(--g1)"></span>Был на тренировке</div>'+
    '<div class="opt" data-k="sick"><span class="d" style="background:var(--g2)"></span>Пропуск по справке</div>'+
    '<div class="opt" data-k="injury"><span class="d" style="background:var(--g3)"></span>Травма</div>'+
    '<div class="opt" data-k="absent"><span class="d" style="background:var(--red)"></span>Не был (без причины)</div>'+
    '<div class="opt" data-k="clear"><span class="d" style="background:var(--mut2)"></span>Убрать отметку</div>'+
    '<div class="opt" id="opencard"><span class="d" style="background:var(--mut)"></span>Открыть карточку ученика</div>'+
    '<div class="link" id="cl">Закрыть</div>';
  openM();
  sh.querySelectorAll('.opt[data-k]').forEach(function(o){o.onclick=function(){var k=o.getAttribute('data-k');if(!s.attendance)s.attendance={};if(k==='clear')delete s.attendance[roster.date];else s.attendance[roster.date]=k;save();closeM();render();};});
  document.getElementById('opencard').onclick=function(){closeM();openCard(s.id);};
  document.getElementById('cl').onclick=closeM;
}
function monthsChain(start,n){var arr=[],cur=start;for(var i=0;i<n;i++){arr.push(cur);cur=nextMonthKey(cur);}return arr;}
function paySheet(s){
  var sh=document.getElementById('sheet'),n=1;
  function label(){return monthsChain(dueMonthKey(s),n).map(function(m){return MNF[+m.slice(5)];}).join(', ');}
  function draw(){
    var pt=paidThrough(s);
    sh.innerHTML='<h3>Оплата · '+esc(s.name)+'</h3><div class="muted">Абонемент '+SPM()+' занятий в месяц. Выбери, за сколько месяцев оплатил. Деньги остаются у тебя.</div>'+
      '<div class="seg" id="mseg"><button data-m="1">1 месяц</button><button data-m="2">2 месяца</button><button data-m="3">3 месяца</button></div>'+
      '<div class="row2" style="margin-bottom:12px"><div><div class="t">Месяцы</div><div class="s" id="mlabel">'+label()+'</div></div><div class="v mono" style="font-weight:800">'+(SPM()*n)+' зан.</div></div>'+
      '<button class="btn acc" id="do">Оплатил за '+n+' '+(n===1?'месяц':(n<5?'месяца':'месяцев'))+'</button>'+(pt?'<button class="btn ghost" id="un">Отменить последнюю оплату</button>':'')+'<div class="link" id="cl">Закрыть</div>';
    sh.querySelectorAll('#mseg button').forEach(function(b){if(+b.getAttribute('data-m')===n)b.classList.add('on');b.onclick=function(){n=+b.getAttribute('data-m');draw();};});
    document.getElementById('do').onclick=function(){if(!s.payments)s.payments=[];monthsChain(dueMonthKey(s),n).forEach(function(m){s.payments.push(m);});save();closeM();render();};
    var u=document.getElementById('un');if(u)u.onclick=function(){s.payments.sort();s.payments.pop();save();closeM();render();};
    document.getElementById('cl').onclick=closeM;
  }
  openM();draw();
}
function groupEditSheet(g){
  var isNew=!g,sh=document.getElementById('sheet'),cnt=isNew?0:inGroup(g.id).length;
  sh.innerHTML='<h3>'+(isNew?'Новая группа':'Группа')+'</h3>'+
    '<label class="lbl">Название</label><input class="field" id="gn" value="'+(isNew?'':esc(g.name))+'" placeholder="Группа 4">'+
    '<label class="lbl">Уровень и возраст</label><input class="field" id="gl" value="'+(isNew?'':esc(g.level))+'" placeholder="новички · 8-10 лет">'+
    '<button class="btn acc" id="sv">Сохранить</button>'+
    (isNew?'':(cnt?'<div class="muted" style="margin-top:10px">Чтобы удалить группу, сначала перенеси или удали её учеников ('+cnt+').</div>':'<button class="btn danger" id="del">Удалить группу</button>'))+
    '<div class="link" id="cl">Закрыть</div>';
  openM();
  document.getElementById('sv').onclick=function(){var n=document.getElementById('gn').value.trim();if(!n)return;var lv=document.getElementById('gl').value.trim()||'группа';if(isNew){var id=1;state.groups.forEach(function(x){if(x.id>=id)id=x.id+1;});state.groups.push({id:id,name:n,level:lv,sessions:[]});}else{g.name=n;g.level=lv;}save();closeM();render();};
  var d=document.getElementById('del');if(d)d.onclick=function(){state.groups=state.groups.filter(function(x){return x.id!==g.id;});save();closeM();render();};
  document.getElementById('cl').onclick=closeM;
}
function schedSheet(g){
  var sh=document.getElementById('sheet');
  function rows(){return g.sessions.map(function(se,i){return '<div class="row2"><div><div class="t">'+['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][se.wd]+'</div><div class="s">'+se.time+' · '+se.dur+' мин · '+esc(se.hall)+'</div></div><button class="btn danger sm" data-del="'+i+'" style="width:auto;margin:0;padding:7px 11px">Удалить</button></div>';}).join('');}
  function draw(){
    sh.innerHTML='<h3>Расписание · '+esc(g.name)+'</h3><div class="muted">Занятия группы. Можно разные дни в разное время.</div>'+rows()+
      '<label class="lbl">Добавить занятие</label>'+
      '<select class="field" id="nwd"><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option><option value="6">Суббота</option><option value="0">Воскресенье</option></select>'+
      '<input class="field" id="ntime" value="18:00" placeholder="Время 18:00">'+
      '<input class="field" id="ndur" value="90" placeholder="Длительность, мин">'+
      '<input class="field" id="nhall" value="Зал 2" placeholder="Зал">'+
      '<button class="btn acc" id="add">Добавить занятие</button><div class="link" id="cl">Готово</div>';
    sh.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){g.sessions.splice(+b.getAttribute('data-del'),1);save();draw();};});
    document.getElementById('add').onclick=function(){g.sessions.push({wd:+document.getElementById('nwd').value,time:document.getElementById('ntime').value,dur:+document.getElementById('ndur').value||90,hall:document.getElementById('nhall').value});g.sessions.sort(function(a,b){return a.wd-b.wd;});save();draw();};
    document.getElementById('cl').onclick=function(){closeM();render();};
  }
  draw();openM();
}
function rulesSheet(){
  var sh=document.getElementById('sheet');
  sh.innerHTML='<h3>Правила оплаты</h3>'+
    '<label class="lbl">Занятий в абонементе</label><input class="field" id="spm" value="'+SPM()+'">'+
    '<label class="lbl">День оплаты (число месяца)</label><input class="field" id="pd" value="'+state.settings.payDay+'">'+
    '<label class="lbl">Перенос остатка</label>'+
    '<div class="opt '+(state.settings.carryMode==='accumulate'?'on':'')+'" data-c="accumulate"><span class="d" style="background:var(--g1)"></span>Платит за 12, сохраненное плюсом</div>'+
    '<div class="opt '+(state.settings.carryMode==='topup'?'on':'')+'" data-c="topup"><span class="d" style="background:var(--g2)"></span>Платит меньшей суммой (до 12)</div>'+
    '<button class="btn acc" id="sv">Сохранить</button><div class="link" id="cl">Закрыть</div>';
  openM();
  sh.querySelectorAll('[data-c]').forEach(function(o){o.onclick=function(){state.settings.carryMode=o.getAttribute('data-c');sh.querySelectorAll('[data-c]').forEach(function(x){x.classList.remove('on');});o.classList.add('on');};});
  document.getElementById('sv').onclick=function(){state.settings.sessionsPerMonth=+document.getElementById('spm').value||12;state.settings.payDay=+document.getElementById('pd').value||5;save();closeM();render();};
  document.getElementById('cl').onclick=closeM;
}
function personSheet(s,defGroup){
  var isNew=!s;var sh=document.getElementById('sheet');
  sh.innerHTML='<h3>'+(isNew?'Новый ученик':esc(s.name))+'</h3>'+
    '<label class="lbl">Имя и фамилия</label><input class="field" id="pn" value="'+(isNew?'':esc(s.name))+'" placeholder="Имя Фамилия">'+
    '<label class="lbl">Группа</label><select class="field" id="pg">'+state.groups.map(function(g){return '<option value="'+g.id+'" '+(((!isNew&&s.group===g.id)||(isNew&&defGroup===g.id))?'selected':'')+'>'+esc(g.name)+' · '+esc(g.level.split(" · ")[0])+'</option>';}).join('')+'</select>'+
    '<label class="lbl">Тип оплаты</label><select class="field" id="pt"><option value="monthly" '+(!isNew&&s.type==='monthly'?'selected':'')+'>Абонемент (12 занятий)</option><option value="single" '+(!isNew&&s.type==='single'?'selected':'')+'>Разовая оплата</option></select>'+
    '<label class="lbl">Телефон ученика</label><input class="field" id="pph" value="'+(isNew?'':esc(s.phone||''))+'" placeholder="+7 ...">'+
    '<label class="lbl">Телефон родителя</label><input class="field" id="ppp" value="'+(isNew?'':esc(s.parentPhone||''))+'" placeholder="+7 ...">'+
    '<button class="btn acc" id="sv">Сохранить</button>'+(isNew?'':'<button class="btn danger" id="del">Удалить ученика</button>')+'<div class="link" id="cl">Закрыть</div>';
  openM();
  document.getElementById('sv').onclick=function(){var n=document.getElementById('pn').value.trim();if(!n)return;var g=+document.getElementById('pg').value,t=document.getElementById('pt').value,ph=document.getElementById('pph').value.trim(),pp=document.getElementById('ppp').value.trim();if(isNew){var nid=String(Date.now());state.students.push({id:nid,name:n,group:g,type:t,payments:[],attendance:{},phone:ph,parentPhone:pp});}else{s.name=n;s.group=g;s.type=t;s.phone=ph;s.parentPhone=pp;}save();closeM();render();};
  var d=document.getElementById('del');if(d)d.onclick=function(){state.students=state.students.filter(function(x){return x.id!==s.id;});card=null;save();closeM();render();};
  document.getElementById('cl').onclick=closeM;
}

document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-t');roster=null;card=null;groupView=null;payView=false;document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');render();};});

load();applyTheme();render();
</script>
